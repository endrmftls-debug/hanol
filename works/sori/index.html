<style>
/* VOICE   quiet, exact, a little dry: a foley artist listening to her grandmother's tapes during a drought summer
   IDEA    the valley in cross-section, the lake dropping a step each chapter, and a cassette deck for what comes up
   PICTURE the valley full bleed; pale bathtub ring above the water, the drowned village emerging terrace by terrace
   COLOUR  hazy summer sky, lake green, the white ring of dry mud; cassette brown and label cream; ballpoint blue for
           the grandmother's labels; one red for the REC light
   TYPE    Gowun Batang for the story, Gowun Dodum for voices on the tapes, Nanum Pen Script for the labels
   LAYOUT  phone: valley above, the chapter as a sheet at the bottom; laptop: the twenty steps of water as a column on the left */
:root{color-scheme:light dark;--paper:light-dark(#f2eee4,#171e21);--paper2:light-dark(#e7e0cf,#212a2d);--ink:light-dark(#1f2a2e,#e9e5da);--ink2:light-dark(#5a6467,#a6aeb0);--rule:light-dark(#d6ccb6,#394447);--rec:#d4432f;--rec2:light-dark(#c33b27,#ee6b56);--pen:light-dark(#2b4c9a,#9cb4f2);--tape:#5a3a24;--deep:#22363b;--f-body:'Gowun Batang','Noto Serif KR',serif;--f-voice:'Gowun Dodum','Noto Sans KR',sans-serif;--f-pen:'Nanum Pen Script','Gowun Dodum',sans-serif;--f-seal:'Song Myung','Gowun Batang',serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--deep);color:var(--ink);font:16px/1.6 var(--f-body);overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}

[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(14,26,30,.46);color:#f1efe8;text-decoration:none;font-size:15px;white-space:nowrap}
.tools{display:flex;gap:8px}

/* a sound chip: a small cassette and what is on it */
.cue{display:inline-flex;align-items:center;gap:10px;min-height:46px;margin:.2em 0 1.25em;padding:6px 16px 6px 8px;border-radius:24px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);font:15px/1.35 var(--f-voice);text-align:left;max-width:100%}

@keyframes spin{to{transform:rotate(360deg)}}
.cue .era{display:block;font-size:12px;color:var(--ink2)}
/* a tape side, transcribed */
.tape{position:relative;margin:2.4em 0;padding:16px 18px 18px;background:var(--paper2);border:1px solid var(--rule);border-radius:4px}

#box{position:absolute;inset:0;z-index:11;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;justify-content:space-between;padding:max(6px,env(safe-area-inset-top)) 8px 0 max(18px,env(safe-area-inset-left))}

.pane{flex:1;overflow-y:auto;padding:14px max(18px,env(safe-area-inset-left)) 120px}

function renderChapter(n) {

/* ---------- turning a chapter into spoken pieces ---------- */
function splitSent(t) {
  const out = [];

    const c = t[i];

      while (j < t.length && '”’".…?!'.includes(t[j])) j++;

    }

  return out;
}

}

    case 'man': return { v: VR.B, pitch: same(VR.B) ? 0.74 : isMale(VR.B) ? 0.96 : 0.8, rate: 0.9 };
    case 'boy': return isMale(VR.B) ? { v: VR.B, pitch: 1.28, rate: 1.06 } : { v: VR.A, pitch: 1.3, rate: 1.06 };

    if (kind === 'cue') { segs.push({ gap: CUE_MS, cue: true, u }); segs.push({ gap: GAP.cue, u }); return; }

function vGoto(i) { NV.idx = clamp(i, 0, NV.segs.length - 1); NV.tok++; vHalt(); stopCue(true); if (NV.paused) { NV.paused = false; } vRun(); playerUpdate(); }
function vSkip(dir) {
  const cur = NV.segs[NV.idx], u = cur ? cur.u : 0;
  let i = NV.idx;
  if (dir > 0) { while (i < NV.segs.length && !(NV.segs[i].text && NV.segs[i].u > u)) i++; }
  else { const target = Math.max(0, (u || 0) - 1); i = NV.segs.findIndex(s => s.text && s.u >= target); }
  if (i < 0 || i >= NV.segs.length) return;
  vGoto(i);
}
function vJump(u) { const i = NV.segs.findIndex(s => s.text && s.u === u); if (i >= 0) vGoto(i); }
function listenTap() {
  if (NV.on) { NV.paused ? vResume() : vPause(); return; }
  const n = S.cur, top = $('.rhead').getBoundingClientRect().bottom + 8;
  const first = $$('#rBody [data-u]').find(el => el.getBoundingClientRect().bottom > top);
  vStart(n, first && $('#reader').scrollTop > 40 ? +first.dataset.u : null);
}
function chapterEnded(n) {
  if (NV.n !== n || !NV.on) return;
  if (n >= LAST) { vStop(); const f = $('#mineForm'); if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (!isRead(n)) stampHere(n);
  const tok = ++NV.tok;
  toast(`다음 장, ${CH[n + 1].title}`);
  NV.timer = setTimeout(() => { if (tok !== NV.tok || !NV.on) return; openReader(n + 1, true); }, 2800);
}
function playerUpdate() {
  const t = $('#pToggle');
  t.setAttribute('aria-label', NV.paused ? '이어 읽기' : '멈춤');
  t.querySelector('.pp').setAttribute('d', NV.paused ? 'M8 5l11 7-11 7z' : 'M9 6v12M15 6v12');
  $('#pRate').textContent = `${(+S.vrate).toFixed(2).replace(/0$/, '').replace(/\.0$/, '')}×`;
}
const RATES = [0.85, 1, 1.15, 1.3];
function playerAct(a) {
  if (a === 'toggle') NV.paused ? vResume() : vPause();
  else if (a === 'stop') vStop();
  else if (a === 'next') vSkip(1);
  else if (a === 'prev') vSkip(-1);
  else if (a === 'rate') {
    const i = RATES.findIndex(r => r >= (+S.vrate) - 0.01);
    S.vrate = RATES[(i + 1) % RATES.length]; save();

    playerUpdate();
  }
}
async function wake(on) {
  try { if (window.NightVoice && window.NightVoice.awake) window.NightVoice.awake(!!on); } catch (e) { /* ignore */ }
  try {
    if (on && 'wakeLock' in navigator && !NV.lock) { NV.lock = await navigator.wakeLock.request('screen'); NV.lock.addEventListener('release', () => { NV.lock = null; }); }
    else if (!on && NV.lock) { await NV.lock.release(); NV.lock = null; }
  } catch (e) { NV.lock = null; }
}
function voiceSetHTML() {
  if (!vSupported()) return `<p class="small">${esc(whyMsg())}</p>`;
  if (!NV.voices.length) return '<p class="small">기기의 기본 한국어 목소리로 읽습니다.</p>';
  const opt = sel => NV.voices.map(v => `<option value="${esc(v.name)}"${sel && sel.name === v.name ? ' selected' : ''}>${esc(v.name.replace(/^Microsoft |^Google /, ''))}${v.net ? ' (온라인)' : ''}</option>`).join('');
  return `<div class="row"><label for="vA">이서의 목소리</label><select id="vA" data-v="vA">${opt(VR.A)}</select></div>
    <div class="row"><label for="vC">테이프 속 할머니의 목소리</label><select id="vC" data-v="vC">${opt(VR.C)}</select></div>
    <div class="row"><label for="vB">테이프 속 남자 목소리</label><select id="vB" data-v="vB">${opt(VR.B)}</select></div>
    <p class="small">테이프에 담긴 말은 다른 목소리로 읽고, 소리 칩이 나오면 읽기를 멈추고 그 소리를 틉니다.</p>`;
}

/* ---------- putting it together ---------- */
function setFS(v) { S.fs = +clamp(v, 0.85, 1.45).toFixed(2); document.documentElement.style.setProperty('--fs', S.fs); save(); }
function setSound(on, quiet) {
  S.sound = !!on; save();
  if (on && !quiet) auInit();
  if (!on) stopCue(true);
  auApply();
  if (AU.ctx) { if (on) AU.ctx.resume().catch(() => {}); }
  const b = $('#bSound');
  b.setAttribute('aria-label', on ? '소리 끄기' : '소리 켜기');
  b.querySelector('.sw1').setAttribute('d', on ? 'M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11' : 'M16 9l5 6M21 9l-5 6');
}
function firstUnread() { for (let n = 0; n <= LAST; n++) if (!isRead(n)) return n; return LAST; }
function showTitle() {
  const t = $('#title'), a = $('#tActs'), app = $('#app');
  const resume = S.read.some(Boolean), nx = firstUnread();
  app.classList.add('titled');
  a.innerHTML = resume
    ? `<button class="btn" data-t="resume">이어 읽기 · ${esc(CH[nx].title)}</button><button class="btn ghost" data-t="look">골짜기 둘러보기</button>`
    : `<button class="btn" data-t="start">읽기 시작</button><button class="btn ghost" data-t="look">골짜기 둘러보기</button>`;
  a.onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    auInit(); auApply();
    t.hidden = true; app.classList.remove('titled');
    mapResize();
    if (b.dataset.t === 'start') openReader(0);
    else if (b.dataset.t === 'resume') openReader(nx);
    else toast('오른쪽 눈금이 오늘의 수위입니다. 물 밖으로 나온 곳을 누르면 1985년의 소리가 납니다.', 5200);
  };
}
function back() {
  if (!$('#reader').hidden) { closeReader(); return true; }
  if (!$('#box').hidden) { closeBox(); return true; }
  if (CL.cur) { stopCue(); return true; }
  return false;
}
window.__back = back;
function valleyTap(cx, cy) {
  if (!$('#title').hidden) return;
  auInit();
  const h = hitAt(cx, cy);
  if (h && h.id === 'graves') { toast(isRead(14) ? '할아버지 산소. 증조할아버지, 증조할머니, 할아버지. 물 건너, 배로만 간다.' : '물 건너 산 중턱의 산소 세 기.'); return; }
  if (h && h.p) {
    const p = h.p;
    if (!h.up) { toast(`${p.name} · 아직 물 밑에 있습니다. 수위가 ${p.e.toFixed(1)}보다 낮아지면 드러납니다.`, 4200); return; }
    showGhost(p.id, 6);
    const tp = tapeOf(p.ch);
    const ok = playCue(p.cue, { era: 'tape', head: tp ? labelText(tp) : p.name, text: `${p.name} · ${p.note}` });
    if (!ok) toast(`${p.name} · ${p.note}`, 4200);
    return;
  }
  // the lake over the village, once it has filled again
  if (cy > Y(M.level) + 6 && cy < M.v.b && (S.cur === LAST || S.cur === 0) && isRead(19)) {
    const ok = playCue('home', { era: 'now', head: '물 밑, 물안리', text: '여 있다.', far: true, dur: 16 });
    toast('물 밑에서 소리가 난다.', 3200);
    void ok;
  }
}
function paneClick(e) {
  const o = e.target.closest('[data-open]');
  if (o) { const n = +o.dataset.open; closeBox(); openReader(n); return; }
  const gf = e.target.closest('[data-gf]');
  if (gf) { GF = gf.dataset.gf; renderPane(); return; }
  const sd = e.target.closest('button[data-side]');
  if (sd) { const s = tapeSides().find(x => x.side === sd.dataset.side); if (s) playSide(s, sd); return; }
  const rc = e.target.closest('[data-rec]');
  if (rc) {
    if (rc.classList.contains('on') && CL.cur) { stopCue(); return; }
    const n = +rc.dataset.rec, lab = chipLabel(n, rc.dataset.cue, rc.dataset.t, { t: 'story' });
    playCue(rc.dataset.cue, { era: lab.era, head: lab.head, text: rc.dataset.t, el: rc });
    return;
  }
  const st = e.target.closest('[data-set]');
  if (!st) return;
  const s = st.dataset.set;
  if (s === 'sound') { setSound(!S.sound); st.setAttribute('aria-pressed', String(S.sound)); }
  else if (s === 'all') { S.all = !S.all; save(); st.setAttribute('aria-pressed', String(S.all)); updateCard(); }
  else if (s === 'reset') {
    if (st.dataset.sure) {
      vStop(); stopCue(true);
      Object.assign(S, { read: [], cur: 0, mine: null, started: false, hint: false });
      save(); updateCard(); setLevel(0); renderPane(); toast('처음으로 되돌렸습니다. 물이 다시 찼습니다.');
    } else { st.dataset.sure = '1'; st.textContent = '정말 지울까요? 한 번 더 누르세요'; st.classList.add('red'); }
  }
}
function paneInput(e) {
  const el = e.target;
  if (el.id === 'gq') { GQ = el.value.trim(); const pos = el.selectionStart; renderPane(); const q = $('#gq'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } }
  else if (el.id === 'sRate') { S.vrate = +el.value; save(); if (NV.on) playerUpdate(); }
  else if (el.id === 'sFs') setFS(+el.value);
  else if (el.dataset.v) { S[el.dataset.v] = el.value; save(); NV.bad.delete(el.value); resolveRoles(); if (NV.on && !NV.paused) vGoto(NV.idx); }
}
function bindUI() {
  $('#strip').addEventListener('click', e => { const b = e.target.closest('button[data-n]'); if (b) select(+b.dataset.n); });
  $('#cb').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act); });
  $('#rBody').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b) { act(b.dataset.act); return; }

    if (c) { if (NV.on && !NV.paused) vPause(); playChip(c); return; }
    const u = e.target.closest('[data-u]');
    if (u && NV.on) vJump(+u.dataset.u);
  });
  const rd = $('#reader');
  ['wheel', 'touchmove'].forEach(ev => rd.addEventListener(ev, () => { NV.userScroll = Date.now(); }, { passive: true }));
  $('#rClose').addEventListener('click', closeReader);
  $('#rListen').addEventListener('click', listenTap);
  $('#rSmall').addEventListener('click', () => setFS(S.fs - 0.08));
  $('#rBig').addEventListener('click', () => setFS(S.fs + 0.08));
  $('#bBox').addEventListener('click', () => openBox());
  $('#xClose').addEventListener('click', closeBox);
  $('#bSound').addEventListener('click', () => setSound(!S.sound));
  $('#dStop').addEventListener('click', () => stopCue());
  $('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { TAB = b.dataset.tab; openBox(); } });
  $('#pane').addEventListener('click', paneClick);
  $('#pane').addEventListener('input', paneInput);
  $('#pane').addEventListener('change', paneInput);
  $('#player').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) playerAct(b.dataset.p); });
  bindValley(valleyTap);
  addEventListener('keydown', e => { if (e.key === 'Escape') back(); });
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { mapResize(); markStrip(); }, 160); });
  document.addEventListener('visibilitychange', () => {
    const speaking = NV.on && !NV.paused;
    auSuspend(document.hidden && !speaking);
    if (!document.hidden && speaking) wake(true);
  });
}
let lastTs = 0;
function loop(ts) {
  const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  try { mapStep(dt); } catch (e) { if (!loop.err) { loop.err = 1; console.error(e); } }
  requestAnimationFrame(loop);
}
/* the deck and the ambience keep time on their own clock, so a locked screen does not stop a tape mid-sound */
setInterval(() => { try { auStep(0.1); } catch (e) { if (!loop.aerr) { loop.aerr = 1; console.error(e); } } }, 100);
function boot() {
  if (!CH.length) return;
  S.cur = clamp(S.cur | 0, 0, LAST);
  if (window.__STANDALONE) $('#home').hidden = true;
  setFS(S.fs || 1);
  renderStrip();
  updateCard();
  setLevel(S.cur, true);
  mapResize();
  bindUI();
  setSound(S.sound, true);
  voiceDetect();
  showTitle();
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { M.still = 0; }).catch(() => {});
}
boot();
if (window.__TEST) window.__t = { M, AU, S, CL, select, setLevel, playCue, stopCue, cueStart, cueFeed, SND, PLACES, X, Y, groundE, hitAt, noiseBuf, auInit, auApply, auStep, renderCue };

})();
