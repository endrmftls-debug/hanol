<style>
/* VOICE   plain, a little guarded: a twelve-year-old who carried words between her parents learns to carry the bees' words without changing them
   IDEA    the valley as a map; every dance in the glass hive becomes a path from the shed to the flowers, set by the sun and the length of the waggle
   PICTURE a hand-drawn spring valley, contour lines and a stream, blossoms that come and go with the chapter's day, small bees walking the paths
   COLOUR  paper and honey; spring greens for the land; the dark amber of a comb; one red for the seal that says 옮김 (carried over)
   TYPE    Gowun Batang for the story, Gowun Dodum for the records, Nanum Pen Script for the notes in the margin
   LAYOUT  phone: the map above, the chapter as a sheet at the bottom; laptop: the chapters as a column on the left */
:root{color-scheme:light dark;--paper:light-dark(#f8f1e2,#1c1710);--paper2:light-dark(#efe4cc,#272016);--ink:light-dark(#2a2118,#f1e7d5);--ink2:light-dark(#6e5d48,#bcaa8e);--rule:light-dark(#e2d4b8,#3b3023);--honey:light-dark(#a8680a,#f0b445);--seal:#c8452f;--ground:#d9dcb0;--f-body:'Gowun Batang','Noto Serif KR',serif;--f-ui:'Gowun Dodum','Noto Sans KR',sans-serif;--f-pen:'Nanum Pen Script',cursive;--f-seal:'Song Myung','Gowun Batang',serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.6 var(--f-body);overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #8fb8ff;outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(42,30,16,.66);color:#eef3fa;text-decoration:none;font:15px var(--f-ui);white-space:nowrap}
.tools{display:flex;gap:8px}
.ib{width:44px;height:44px;padding:0;border-radius:22px;border:0;background:rgba(42,30,16,.66);color:#eef3fa;display:grid;place-items:center}
.ib svg,.chip svg,.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toast{position:absolute;z-index:40;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 58px);transform:translate(-50%,-10px);max-width:min(92vw,470px);padding:12px 18px;border-radius:14px;background:rgba(42,30,16,.93);color:#fbf3e2;font:15px/1.5 var(--f-ui);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* the chapter sheet */
.card{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;padding:4px 0 max(14px,env(safe-area-inset-bottom))}
.strip{display:flex;overflow-x:auto;gap:2px;padding:6px 10px 2px;scrollbar-width:none;scroll-behavior:smooth}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:50px;min-height:52px;border:0;border-radius:10px;background:none;color:var(--ink2);display:grid;justify-items:center;align-content:center;gap:5px;font:13px/1.1 var(--f-ui);padding:4px 0;font-variant-numeric:tabular-nums}
.strip .sw2{display:none}
.strip i{width:9px;height:9px;border:1.5px solid currentColor;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);border:0;background:currentColor;opacity:.35}
.strip .rd i{opacity:1}
.strip .on{color:var(--honey);background:var(--paper2)}
.strip .lk{opacity:.4}
.cb{padding:8px max(20px,env(safe-area-inset-left)) 0}
.cb .term{margin:0;font:14px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.cb h2{margin:2px 0 2px;font-size:clamp(30px,8.4vw,42px);line-height:1.08;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.cb .sub{margin:0;font-size:17px}
.cb .meta{margin:6px 0 0;font:14px var(--f-ui);color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.btn{height:48px;padding:0 22px;border-radius:24px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:700 17px var(--f-body);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.honey{background:var(--honey);border-color:var(--honey);color:light-dark(#fffaf0,#2a1d0c)}
.btn svg{width:20px;height:20px;stroke-width:1.8}
.note{font:14px var(--f-ui);color:var(--ink2);margin:10px 0 0}
.small{font:14px/1.6 var(--f-ui);color:var(--ink2)}
.link{border:0;background:none;padding:6px 0;color:var(--honey);font:15px var(--f-ui);text-decoration:underline;text-underline-offset:3px}
/* title */
#title{position:absolute;inset:0;z-index:20;display:grid;align-content:end;padding:0 max(22px,env(safe-area-inset-left)) max(34px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(40,28,12,0) 0%,rgba(40,28,12,.32) 34%,rgba(32,22,9,.94) 60%,rgba(32,22,9,.97) 100%);color:#fbf3e2;pointer-events:none}
#title .acts{pointer-events:auto}
#app.titled #card{visibility:hidden}
#title .by{margin:0;font:15px var(--f-ui);opacity:.86}
#title h1{margin:6px 0 10px;font-size:clamp(40px,11vw,68px);line-height:1.05;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
#title .lead{margin:0;max-width:31em;font-size:17px;line-height:1.7;opacity:.93}
#title .acts .btn{background:#fbf3e2;color:#2a1d0c;border-color:#fbf3e2}
#title .acts .btn.ghost{background:transparent;color:#fbf3e2}
#title .hint{margin:14px 0 0;font:14px var(--f-ui);opacity:.76}
/* reader */
#reader{position:absolute;inset:0;z-index:12;background:var(--paper);color:var(--ink);overflow-y:auto;overscroll-behavior:contain}
.rhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--paper);border-bottom:1px solid var(--rule)}
.rhead .ib{background:none;color:var(--ink)}
.rhead .rt{font:15px var(--f-ui);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rhead .grp{display:flex;gap:2px}
.rbody{max-width:660px;margin:0 auto;padding:26px max(20px,env(safe-area-inset-left)) 160px;font-size:calc(18px * var(--fs,1));line-height:1.86}
.rbody p{margin:0 0 1.05em}
.chead{margin:4px 0 34px}
.chead .cl{margin:0;font:15px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.chead h1{margin:4px 0 6px;font-size:clamp(36px,9vw,52px);line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
.chead .cs{margin:0;font-size:1.05em}
.chead .cm{margin:12px 0 0;font:14px/1.5 var(--f-ui);color:var(--ink2)}
.brk{display:block;text-align:center;margin:1.8em 0;color:var(--ink2);letter-spacing:.6em}
.lines{white-space:pre-line;font-family:var(--f-ui);font-size:.92em;line-height:1.9;padding:.2em 0 .2em 1em;border-left:2px solid var(--rule)}
.speaking{background:color-mix(in srgb,#e8a52a 22%,transparent);border-radius:3px;box-shadow:0 0 0 4px color-mix(in srgb,#e8a52a 22%,transparent)}
/* an entry in the observation notebook */
.rec{position:relative;margin:2.6em 0 1.6em;padding:16px 16px 18px;border:1px solid var(--rule);border-radius:6px;background:var(--paper2);background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 1.9em;background-position:0 .6em;font-family:var(--f-ui)}
.rec .rh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:13px;color:var(--ink2);letter-spacing:.04em}
.rec .rw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.rec canvas{width:100%;aspect-ratio:1;border-radius:6px;background:#f3e2b4;display:block;cursor:pointer}
.rec .rw.nod{grid-template-columns:1fr}
.rec dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:.84em;line-height:1.55}
.rec dt{color:var(--ink2)}
.rec dd{margin:0}
.rec .memo{margin:12px 0 0;font:1.32em/1.45 var(--f-pen);color:var(--honey)}
.rec .memo p{margin:0}
.rec .ra{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rec .ra button{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--rule);background:var(--paper);font:14px var(--f-ui)}
@media (max-width:420px){.rec .rw{grid-template-columns:1fr}.rec canvas{width:min(100%,300px);justify-self:center}}
.cend{margin-top:56px;padding-top:24px;border-top:1px solid var(--rule);display:grid;gap:14px;justify-items:start}
.cend .done{display:flex;align-items:center;gap:12px;color:var(--ink2);font:15px var(--f-ui)}
.stamp{display:inline-grid;place-items:center;width:58px;height:58px;border:2px solid var(--seal);color:var(--seal);font:700 17px/1 var(--f-seal);border-radius:50%;transform:rotate(-8deg);opacity:.9}
.stampfx{animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(1.6) rotate(-16deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:.9}}
.mine{display:grid;gap:14px;width:100%;margin-top:10px;font-size:16px}
.mine label{display:grid;gap:6px;font:15px var(--f-ui);color:var(--ink2)}
.mine input,.mine textarea{font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:12px;width:100%}
.mine textarea{min-height:100px;resize:vertical;font-family:var(--f-ui)}
.mine .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
/* narration */
#player{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:28px;background:var(--ink);color:var(--paper);max-width:calc(100vw - 24px)}
#player .ib{background:none;color:var(--paper)}
#player .rate{width:auto;padding:0 12px;font:15px var(--f-ui)}
#player .pt{font:14px var(--f-ui);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
/* the crystal on black velvet */
#viewer{position:absolute;inset:0;z-index:18;background:radial-gradient(120% 90% at 50% 40%,#3b2a14 0%,#160f07 72%);color:#f4ead6;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.vhead .ib{background:rgba(255,255,255,.07)}
.vhead .vt{font:15px var(--f-ui);color:#d2bd95}
.vstage{position:relative;flex:none;width:min(94vw,64vh,620px);aspect-ratio:1;margin:6px auto 0}
#vcv{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.vgaze{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:14px var(--f-ui);color:#b8c6d8;pointer-events:none}
.vinfo{width:min(94vw,620px);margin:8px auto 0;padding:0 4px max(24px,env(safe-area-inset-bottom))}
.vinfo h2{margin:0;font-size:30px;line-height:1.15}
.vinfo .vs{margin:4px 0 0;font:15px var(--f-ui);color:#d2bd95}
.vinfo dl{margin:12px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font:15px/1.6 var(--f-ui)}
.vinfo dt{color:#b89f76}
.vinfo dd{margin:0}
.vinfo .acts .btn{background:#f4ead6;color:#2a1d0c;border-color:#f4ead6;font-family:var(--f-ui);font-weight:400;height:44px;font-size:16px;padding:0 18px}
.vinfo .acts .btn.ghost{background:transparent;color:#f4ead6;border-color:rgba(244,234,214,.5)}
.vinfo .acts .btn[aria-pressed=true]{background:#f0b445;border-color:#f0b445;color:#2a1d0c}
.vtabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.vtabs button{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid rgba(244,234,214,.4);background:none;color:#f4ead6;font:14px var(--f-ui)}
.vtabs button[aria-pressed=true]{background:#f0b445;border-color:#f0b445;color:#2a1d0c}
.vrow{margin-top:12px;padding-left:10px;border-left:3px solid var(--k,#c9800f)}
.vrow dl{margin:0}
.vtime{display:grid;gap:6px;margin-top:14px;font:15px var(--f-ui)}
.vtime input{width:100%;accent-color:#f0b445}
.vnote{color:#cdb994;margin:6px 0 0}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px;align-items:end}
.bcol{display:grid;gap:6px;justify-items:center;font:12px/1.3 var(--f-ui);color:#cdb994;text-align:center;opacity:.6}
.bcol.on{opacity:1;color:#f4ead6}
.bb{display:flex;align-items:flex-end;gap:3px;height:90px;width:100%;justify-content:center;border-bottom:1px solid rgba(244,234,214,.3)}
.bb i{display:block;width:22%;min-height:2px;border-radius:3px 3px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font:13px var(--f-ui);color:#e8dcc4}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* growing your own */
#qpanel{position:absolute;z-index:6;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(92px,30%) minmax(0,1fr);gap:4px 12px;align-items:start;border-radius:16px;background:rgba(36,25,11,.9);border:1px solid rgba(240,180,69,.3);color:#f4ead6;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#qpanel[hidden]{display:none}
#qcv{display:block;width:100%;aspect-ratio:1;border-radius:10px;background:#5c3a16}
#qpanel .qq{margin:2px 0 0;font:14px/1.55 var(--f-ui);color:#ecdfc6}
#qpanel .acts{grid-column:1/-1;margin-top:6px;gap:8px;flex-wrap:nowrap}
#qpanel .btn{flex:1 1 0;min-width:0;height:42px;padding:0 8px;font:15px var(--f-ui);background:#f4ead6;color:#2a1d0c;border-color:#f4ead6;white-space:nowrap}
#qpanel .btn:disabled{opacity:.45}
#qpanel .btn.ghost{background:transparent;color:#f4ead6;border-color:rgba(244,234,214,.45)}
#qhint{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 62px);width:max-content;max-width:min(92vw,460px);padding:10px 16px;border-radius:14px;background:rgba(36,25,11,.86);color:#f4ead6;font:15px/1.5 var(--f-ui);text-align:center}
/* the box: contents, album, words, settings */
#box{position:absolute;inset:0;z-index:11;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;justify-content:space-between;padding:max(6px,env(safe-area-inset-top)) 8px 0 max(18px,env(safe-area-inset-left))}
.bhead h2{margin:0;font-size:22px}
.bhead .ib{background:none;color:var(--ink)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:48px;padding:0 13px;border:0;border-bottom:2px solid transparent;background:none;font:16px var(--f-ui);color:var(--ink2)}
.tabs button[aria-selected=true]{color:var(--honey);border-bottom-color:var(--honey)}
.pane{flex:1;overflow-y:auto;padding:14px max(18px,env(safe-area-inset-left)) 120px}
.toc{list-style:none;margin:0;padding:0}
.toc li+li{border-top:1px solid var(--rule)}
.toc button{width:100%;min-height:62px;border:0;background:none;display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:8px 2px}
.toc .t1{font:14px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.toc .t2{font-size:18px;font-weight:700;line-height:1.25}
.toc .t3{display:block;font:14px var(--f-ui);font-weight:400;color:var(--ink2)}
.toc .sm{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--seal);color:var(--seal);border-radius:50%;font:700 12px/1 var(--f-seal);transform:rotate(-8deg)}
.toc .lk{opacity:.45}
.toc .cur .t2{color:var(--honey)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.2em,1fr));gap:10px;margin-top:12px}
.album button{border:0;padding:0;background:none;text-align:left;display:grid;gap:4px;font:13px/1.35 var(--f-ui);color:var(--ink2)}
.album canvas{width:100%;aspect-ratio:1;border-radius:8px;background:#f3e2b4;display:block}
.album .ph{width:100%;aspect-ratio:1;border-radius:8px;background:var(--paper2);display:grid;place-items:center;font:15px var(--f-ui);color:var(--ink2);text-align:center;padding:8px}
.album b{color:var(--ink);font-size:14px}
.album button:disabled{cursor:default;opacity:.55}
.gfil{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.gfil button{height:38px;padding:0 13px;border-radius:19px;border:1.5px solid var(--rule);background:none;font:14px var(--f-ui)}
.gfil button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.gsearch{width:100%;font:16px var(--f-ui);padding:11px 12px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper)}
.gl{list-style:none;margin:8px 0 0;padding:0}
.gl li{padding:11px 0;border-top:1px solid var(--rule)}
.gl b{font-size:17px}
.gl .k{font:13px var(--f-ui);color:var(--ink2);margin-left:6px}
.gl p{margin:3px 0 0;font:15px/1.65 var(--f-ui)}
.gl .go{font-size:14px}
.set{display:grid;gap:18px;font-family:var(--f-ui)}
.set h3{margin:6px 0 0;font-size:16px}
.set .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.set select{font-size:16px;padding:10px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);max-width:100%}
.set input[type=range]{width:min(100%,260px);accent-color:var(--honey)}
.sw{position:relative;width:58px;height:34px;border-radius:17px;border:1.5px solid var(--rule);background:var(--paper2);padding:0;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--ink2);transition:left .2s}
.sw[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
.sw[aria-pressed=true]::after{left:26px;background:var(--paper)}
.ylab{margin:10px 0 0;padding:12px 14px;border:1px dashed var(--rule);border-radius:8px;background:var(--paper2);font:15px/1.6 var(--f-ui)}
@media (min-width:900px){
  .card{left:max(16px,env(safe-area-inset-left));right:auto;top:max(16px,env(safe-area-inset-top));bottom:max(16px,env(safe-area-inset-bottom));width:420px;border-radius:18px;display:flex;flex-direction:column;padding:10px 0 18px}
  .strip{flex-direction:column;overflow-x:hidden;overflow-y:auto;flex:1;padding:4px 14px;gap:0}
  .strip button{width:auto;min-height:40px;display:grid;grid-template-columns:3.6em 12px minmax(0,1fr);justify-items:start;align-items:center;text-align:left;gap:10px;font-size:14px;padding:4px 10px}
  .strip .sw2{display:block;font:16px var(--f-body);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .strip .on .sw2{color:var(--honey)}
  .cb{padding-top:12px;border-top:1px solid var(--rule);margin-top:6px}
  .top{left:452px}
  #title{align-content:center;padding-left:8vw;background:linear-gradient(90deg,rgba(32,22,9,.9) 0%,rgba(32,22,9,.58) 40%,rgba(32,22,9,0) 72%)}

<script>
(function () {
'use strict';
const $ = (s, r = document) => r.querySelector(s);

const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = window.__DATA || { chapters: [], glossary: [] };
const CH = D.chapters;
const LAST = CH.length - 1;
const KEY = 'beol-mal-v1';
const S = Object.assign({ read: [], cur: 0, sound: true, fs: 1, all: false, vrate: 1, vA: '', vB: '', vC: '', started: false, quiz: { best: null, plays: 0 } }, (() => {

})());
if (!S.quiz || typeof S.quiz !== 'object') S.quiz = { best: null, plays: 0 };

const isRead = n => !!S.read[n];

const M = { reduce: matchMedia('(prefers-reduced-motion: reduce)').matches, paused: false, dpr: 1, w: 0, h: 0, sel: 0 };

function chLabel(n, long) {

  return long ? `제${n}장 · ${CH[n].date}` : String(n);
}
function hideTitle() { $('#title').hidden = true; $('#app').classList.remove('titled'); }

// 받침 있으면 첫째, 없으면 둘째
function josa(word, a, b) {

}
const recOf = n => (CH[n] && CH[n].secs.find(s => s.t === 'record')) || null;

function dancesOf(n) {
  return CH[n].dances.map(d => Object.assign({}, d, danceFor(d.t, d.m, d.d, d.h, d.mi, d.y)));
}

/* ---------- 꽃두메: 골짜기의 땅과 꽃, 해, 그리고 춤을 말로 옮기는 셈 ----------
   유리 벌통이 있는 헛간을 0으로 두고, 동쪽으로 x, 북쪽으로 y (미터). */
const HIVE = { x: 0, y: 0 };
const RULER = 400;             // 꽃두메 토종벌의 춤 자: 일 초에 사백 미터
const LAT = 35.37, LON = 127.87;
const TG = {
  생강나무: { x: -250, y: 380, name: '뒷산 생강나무', kind: 'tree', col: '#e8c33a', bloom: [[3, 1], [3, 31]] },
  산수유: { x: 350, y: -420, name: '아랫마을 길 산수유', kind: 'tree', col: '#f2bf22', bloom: [[3, 4], [4, 6]] },
  벚나무: { x: 180, y: -800, name: '개울 벚나무길', kind: 'row', col: '#f7c6d4', bloom: [[3, 25], [4, 12]] },
  유채: { x: 500, y: -200, name: '개울 건너 유채밭', kind: 'field', col: '#f1d22e', bloom: [[4, 1], [4, 30]] },
  냉이: { x: -60, y: -110, name: '묵은 밭 냉이꽃', kind: 'patch', col: '#fbf8ec', bloom: [[3, 20], [4, 30]] },
  복숭아: { x: -420, y: -560, name: '할머니 복숭아밭', kind: 'orchard', col: '#f093ad', bloom: [[4, 8], [4, 28]] },
  진달래: { x: -600, y: 900, name: '진달래 능선', kind: 'ridge', col: '#db4f95', bloom: [[4, 3], [5, 6]] },
  아까시: { x: -700, y: -300, name: '아까시 언덕', kind: 'hill', col: '#fbf8ee', bloom: [[5, 3], [5, 26]] },
  밤나무: { x: 600, y: 750, name: '밤나무 숲', kind: 'forest', col: '#efe3a8', bloom: [[6, 3], [6, 30]] },
  메밀: { x: -150, y: -900, name: '개울 아래 메밀밭', kind: 'field', col: '#fcfbf5', bloom: [[8, 22], [10, 8]] },
  분봉통: { x: -315, y: 50, name: '대숲 옆 분봉통', kind: 'box', from: 9 },
  느티나무: { x: 297, y: 475, name: '성황당 느티나무', kind: 'zelkova', from: 12 },
  빈집: { x: -180, y: -150, name: '빈집 돌담', kind: 'wall', from: 12 }
};
Object.keys(TG).forEach(k => { TG[k].key = k; });
const PERSIMMON = { x: 12, y: 8 };

/* 해: 날짜와 시각(한국 시간)으로 방위각과 고도를 셈한다 */
function sunAt(m, d, h, mi, y = 2026) {
  const t = Date.UTC(y, m - 1, d, h - 9, mi), t0 = Date.UTC(y, 0, 1);
  const doy = Math.floor((t - t0) / 864e5) + 1, hr = ((t / 36e5) % 24 + 24) % 24;
  const g = 2 * Math.PI / 365 * (doy - 1 + (hr - 12) / 24);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = (hr * 60 + eqt + 4 * LON) / 4 - 180, H = ha * Math.PI / 180, la = LAT * Math.PI / 180;
  const cz = Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(H);
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(la) - Math.tan(dec) * Math.cos(la)) * 180 / Math.PI + 180;
  return { az: (az + 360) % 360, alt: 90 - Math.acos(clamp(cz, -1, 1)) * 180 / Math.PI };
}
const bearingOf = p => (Math.atan2(p.x - HIVE.x, p.y - HIVE.y) * 180 / Math.PI + 360) % 360;
const distOf = p => Math.hypot(p.x - HIVE.x, p.y - HIVE.y);
const wrap180 = a => ((a + 540) % 360) - 180;
// 그 꽃을 그 시각에 벌은 어떻게 추나
function danceFor(key, m, d, h, mi, y) {
  const p = TG[key], s = sunAt(m, d, h, mi, y), br = bearingOf(p), dist = distOf(p);
  return { name: p.name, br, dist, az: s.az, alt: s.alt, th: wrap180(br - s.az), dur: dist / RULER };
}
/* 말로 옮기기 */
const DIR8 = ['북쪽', '북동쪽', '동쪽', '동남쪽', '남쪽', '남서쪽', '서쪽', '북서쪽'];
const CARD = ['북', '동', '남', '서'];
// 가까운 동서남북에서 얼마나 비켜 있나: 조금 비키면 '서쪽에서 조금 남쪽', 많이 비키면 '남서쪽'
function dirWord(b) {
  b = ((b % 360) + 360) % 360;
  const ci = Math.round(b / 90) % 4, d = wrap180(b - ci * 90);
  if (Math.abs(d) <= 11) return CARD[ci] + '쪽';
  if (Math.abs(d) >= 28) return DIR8[Math.round(b / 45) % 8];
  return `${CARD[ci]}쪽에서 조금 ${CARD[(ci + (d > 0 ? 1 : 3)) % 4]}쪽`;
}
function tiltWord(th) {
  const a = Math.abs(Math.round(th));
  if (a <= 6) return '위로 곧게';
  if (a >= 174) return '아래로 곧게';
  return `위에서 ${th > 0 ? '오른쪽' : '왼쪽'}으로 ${a}도`;
}
function turnWord(th) {
  const a = Math.abs(Math.round(th));
  if (a <= 6) return '해 쪽으로 곧장';
  if (a >= 174) return '해를 등지고 곧장';
  return `해에서 ${th > 0 ? '오른쪽' : '왼쪽'}으로 ${a}도`;
}
const meterWord = m => m >= 1000 ? `${(m / 1000).toFixed(1).replace(/\.0$/, '')}킬로미터` : `${Math.round(m / 10) * 10}미터`;
function clockWord(h, mi) {
  const ap = h < 12 ? '오전' : h === 12 ? '낮' : '오후', hh = h > 12 ? h - 12 : h;
  return `${ap} ${hh}시${mi ? ` ${mi}분` : ''}`;
}
const inBloom = (p, m, d) => !!p.bloom && (m * 100 + d) >= (p.bloom[0][0] * 100 + p.bloom[0][1]) && (m * 100 + d) <= (p.bloom[1][0] * 100 + p.bloom[1][1]);
// 장의 날짜(월, 일): 춤이 있으면 첫 춤의 날, 없으면 제목 아래 날짜
function dayOf(n) {
  const c = CH[n];
  if (c.dances.length && c.dances[0].y === 2026) return { m: c.dances[0].m, d: c.dances[0].d };
  if (c.dances.length) return { m: c.dances[0].m, d: c.dances[0].d };
  const mm = /(\d+)월\s*(\d+)일/.exec(c.date);
  return mm ? { m: +mm[1], d: +mm[2] } : { m: 5, d: 25 };
}

/* ---------- 땅: 높이, 개울, 길, 집 ---------- */
const streamX = y => 150 + 55 * Math.sin(y / 620) + 20 * Math.sin(y / 230);
function elev(x, y) {
  const dx = x - streamX(y), open = y < -450 ? clamp((-450 - y) / 500, 0, 1) : 0;
  let h = dx * dx * 0.00026 * (1 - 0.6 * open) + (y + 1200) * 0.03;
  const bump = (cx, cy, r, a) => a * Math.exp(-((x - cx) * (x - cx) + (y - cy) * (y - cy)) / (2 * r * r));

}
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const ROADS = (() => {
  const main = [], up = [], west = [], east = [];
  for (let y = 40; y >= -1150; y -= 30) main.push({ x: streamX(y) - 46 - (y > -60 ? (y + 60) * 0.9 : 0), y });
  [[-4, 10], [60, 120], [150, 250], [230, 360], [290, 470]].forEach(([x, y]) => up.push({ x, y }));
  [[-10, 0], [-90, 20], [-180, 40], [-260, 52], [-316, 58]].forEach(([x, y]) => west.push({ x, y }));
  const by = -260, bx = streamX(by);
  [[bx - 46, by], [bx + 30, by - 30], [bx + 120, by - 110], [260, -380], [330, -430], [420, -480]].forEach(([x, y]) => east.push({ x, y }));
  return { main, up, west, east };
})();
const HOUSES = (() => {
  const r = rng(77), out = [];
  for (let i = 0; i < 22; i++) {
    const y = -40 - r() * 640, sx = streamX(y) - 46, side = r() < 0.7 ? -1 : 1;
    out.push({ x: sx + side * (18 + r() * 60), y, w: 0.8 + r() * 0.5, roof: r() < 0.5 ? '#b5654a' : r() < 0.7 ? '#5f7896' : '#8c8f6a' });
  }
  for (let i = 0; i < 9; i++) out.push({ x: 300 + r() * 160, y: -430 - r() * 170, w: 0.8 + r() * 0.5, roof: r() < 0.5 ? '#b5654a' : '#5f7896' });
  return out;
})();
const LABELS = [
  { t: '꽃두메', x: 20, y: -330, big: true },

function vGoto(i) { NV.idx = clamp(i, 0, NV.segs.length - 1); NV.tok++; vHalt(); if (NV.paused) { NV.paused = false; } vRun(); playerUpdate(); }
function vSkip(dir) {
  const cur = NV.segs[NV.idx], u = cur ? cur.u : 0;
  let i = NV.idx;
  if (dir > 0) { while (i < NV.segs.length && !(NV.segs[i].text && NV.segs[i].u > u)) i++; }
  else { const target = Math.max(0, (u || 0) - 1); i = NV.segs.findIndex(s => s.text && s.u >= target); }
  if (i < 0 || i >= NV.segs.length) return;
  vGoto(i);
}
function vJump(u) { const i = NV.segs.findIndex(s => s.text && s.u === u); if (i >= 0) vGoto(i); }
function listenTap() {
  if (NV.on) { NV.paused ? vResume() : vPause(); return; }
  const n = S.cur, top = $('.rhead').getBoundingClientRect().bottom + 8;
  const first = $$('#rBody [data-u]').find(el => el.getBoundingClientRect().bottom > top);
  vStart(n, first && $('#reader').scrollTop > 40 ? +first.dataset.u : null);
}
function chapterEnded(n) {
  if (NV.n !== n || !NV.on) return;
  if (n >= LAST) { vStop(); if (!isRead(n)) stampHere(n); const f = $('#rBody [data-act=quiz]'); if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (!isRead(n)) stampHere(n);
  const tok = ++NV.tok;
  toast(`다음 장, ${CH[n + 1].title}`);
  NV.timer = setTimeout(() => { if (tok !== NV.tok || !NV.on) return; openReader(n + 1, true); }, 2800);
}
function playerUpdate() {
  const t = $('#pToggle');
  t.setAttribute('aria-label', NV.paused ? '이어 읽기' : '멈춤');
  t.querySelector('.pp').setAttribute('d', NV.paused ? 'M8 5l11 7-11 7z' : 'M9 6v12M15 6v12');
  $('#pRate').textContent = `${(+S.vrate).toFixed(2).replace(/0$/, '').replace(/\.0$/, '')}×`;
}
const RATES = [0.85, 1, 1.15, 1.3];
function playerAct(a) {
  if (a === 'toggle') NV.paused ? vResume() : vPause();
  else if (a === 'stop') vStop();
  else if (a === 'next') vSkip(1);
  else if (a === 'prev') vSkip(-1);
  else if (a === 'rate') {
    const i = RATES.findIndex(r => r >= (+S.vrate) - 0.01);
    S.vrate = RATES[(i + 1) % RATES.length]; save();
    if (NV.on && !NV.paused) vGoto(NV.idx);
    playerUpdate();
  }
}
async function wake(on) {
  try { if (window.NightVoice && window.NightVoice.awake) window.NightVoice.awake(!!on); } catch (e) { /* ignore */ }
  try {
    if (on && 'wakeLock' in navigator && !NV.lock) { NV.lock = await navigator.wakeLock.request('screen'); NV.lock.addEventListener('release', () => { NV.lock = null; }); }
    else if (!on && NV.lock) { await NV.lock.release(); NV.lock = null; }
  } catch (e) { NV.lock = null; }
}
function voiceSetHTML() {
  if (!vSupported()) return `<p class="small">${esc(whyMsg())}</p>`;
  if (!NV.voices.length) return '<p class="small">기기의 기본 한국어 목소리로 읽습니다.</p>';
  const opt = sel => NV.voices.map(v => `<option value="${esc(v.name)}"${sel && sel.name === v.name ? ' selected' : ''}>${esc(v.name.replace(/^Microsoft |^Google /, ''))}${v.net ? ' (온라인)' : ''}</option>`).join('');
  return `<div class="row"><label for="vA">하나의 목소리</label><select id="vA" data-v="vA">${opt(VR.A)}</select></div>
    <div class="row"><label for="vC">기록의 목소리</label><select id="vC" data-v="vC">${opt(VR.C)}</select></div>
    <p class="small">장 끝의 춤 기록은 다른 목소리로 읽습니다.</p>`;
}

/* ---------- 이어 붙이기 ---------- */
function setFS(v) { S.fs = +clamp(v, 0.85, 1.45).toFixed(2); document.documentElement.style.setProperty('--fs', S.fs); save(); }
function setSound(on, quiet) {
  S.sound = !!on; save();
  const b = $('#btnSound');
  b.setAttribute('aria-label', S.sound ? '소리 끄기' : '소리 켜기');
  b.querySelector('.sw-on').style.display = S.sound ? '' : 'none';
  b.querySelector('.sw-off').style.display = S.sound ? 'none' : '';
  if (S.sound) auInit();
  auApply();
  if (!quiet) toast(S.sound ? '소리를 켰습니다. 봄 골짜기의 새소리가 들립니다.' : '소리를 껐습니다.');
}
function firstUnread() { for (let n = 0; n <= LAST; n++) if (!isRead(n)) return n; return LAST; }
function showTitle() {
  const nx = firstUnread(), any = S.read.some(Boolean), all = CH.every((c, n) => isRead(n));
  $('#tActs').innerHTML = all
    ? `<button class="btn" data-t="look">지도 둘러보기</button><button class="btn ghost" data-t="quiz">${ICON.bee}옮겨 보기</button>`
    : any
    ? `<button class="btn" data-t="resume">이어 읽기 · ${esc(CH[nx].title)}</button><button class="btn ghost" data-t="look">지도 둘러보기</button>`
    : `<button class="btn" data-t="start">읽기 시작</button><button class="btn ghost" data-t="look">지도 둘러보기</button>`;
  $('#title').hidden = false; $('#app').classList.add('titled');
}
function back() {
  if (!$('#viewer').hidden) { closeViewer(); return; }
  if (MAP.quiz) { quizQuit(); return; }
  if (!$('#box').hidden) { closeBox(); return; }
  if (!$('#reader').hidden) { closeReader(); return; }
}
let resetArm = 0;
function act(a, el) {
  const n = el && el.dataset.n != null ? +el.dataset.n : M.sel;
  switch (a) {
    case 'read': openReader(M.sel); break;
    case 'listen': if (el && el.closest('#reader')) listenTap(); else openReader(M.sel, true); break;
    case 'view': openViewer(n); break;
    case 'onMap': closeReader(); closeViewer(true); select(n); break;
    case 'queen': queenSong(); toast('뚜우— 뚜 뚜 뚜. 그리고 방 속 여왕들의 꽉꽉.', 4200); break;
    case 'stamp': stampHere(S.cur); break;
    case 'nextCh': openReader(S.cur + 1); break;
    case 'toMap': closeReader(); break;
    case 'quiz': startQuiz(); break;
    case 'closeReader': closeReader(); break;
    case 'closeViewer': closeViewer(); break;
    case 'closeBox': closeBox(); break;
    case 'fsDown': setFS(S.fs - 0.05); break;
    case 'fsUp': setFS(S.fs + 0.05); break;
    case 'vRead': closeViewer(true); openReader(n); break;
    case 'vMap': closeViewer(true); if (!isRead(VW.n)) markRead(VW.n); select(VW.n); break;
    case 'vOver': VW.over = !VW.over; el.setAttribute('aria-pressed', String(VW.over)); break;
    case 'vAt': vSetTime(+el.dataset.m); { const s = $('#vT'); if (s) s.value = VW.mins; } break;
    case 'vDb': VW.dbIdx = +el.dataset.i; VW.ds = vDancesNow(); setDancers(); vInfo(); break;
    case 'vLift': vLift(); break;
    case 'sound': setSound(!S.sound, true); renderPane(); break;
    case 'all': S.all = !S.all; save(); renderStrip(); updateCard(); renderPane(); $('#btnQuiz').hidden = !(isRead(4) || S.all); break;
    case 'reset':
      if (Date.now() - resetArm > 4000) { resetArm = Date.now(); el.textContent = '정말 지울까요? 한 번 더 누르세요'; break; }
      S.read = []; S.cur = 0; S.started = false; S.all = false; S.quiz = { best: null, plays: 0 }; S.quizTold = false; save();
      renderStrip(); select(0); renderPane(); closeBox(); showTitle(); $('#btnQuiz').hidden = true; toast('처음으로 되돌렸습니다. 다시 경칩을 기다립니다.');
      break;
  }
}
function paneClick(e) {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; renderPane(); return; }
  if (t.dataset.open != null) { closeBox(); openReader(+t.dataset.open); return; }
  if (t.dataset.view != null) { openViewer(+t.dataset.view); return; }
  if (t.dataset.gf != null) { GF = t.dataset.gf; renderPane(); return; }
  if (t.dataset.act) act(t.dataset.act, t);
}
function paneInput(e) {
  const t = e.target;
  if (t.id === 'gsq') { GQ = t.value; const pos = t.selectionStart; renderPane(); const q = $('#gsq'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } } }
  else if (t.id === 'vr') { S.vrate = +t.value; save(); if (NV.on) playerUpdate(); }
  else if (t.id === 'fsr') setFS(+t.value);
  else if (t.dataset.v) { S[t.dataset.v] = t.value; save(); resolveRoles(); }
}
function bindUI() {
  $('#strip').addEventListener('click', e => { const b = e.target.closest('button[data-n]'); if (b) select(+b.dataset.n); });
  $('#cbInner').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b); });
  $('#tActs').addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    auInit(); S.started = true; save();
    hideTitle();
    if (b.dataset.t === 'start') openReader(0);
    else if (b.dataset.t === 'resume') openReader(firstUnread());
    else if (b.dataset.t === 'quiz') startQuiz();
  });
  $('#reader').addEventListener('click', e => {
    const cv = e.target.closest('canvas[data-dn]');
    if (cv) { openViewer(+cv.dataset.dn); return; }
    const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b);
  });
  $('#reader').addEventListener('scroll', () => { NV.userScroll = Date.now(); }, { passive: true });
  $('#rBody').addEventListener('dblclick', e => { const p = e.target.closest('[data-u]'); if (p && NV.on) vJump(+p.dataset.u); });
  $('#player').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) playerAct(b.dataset.p); });
  $('#viewer').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b); });
  $('#viewer').addEventListener('input', e => { if (e.target.id === 'vT') vSetTime(+e.target.value); });
  $('#box').addEventListener('click', e => { const b = e.target.closest('[data-act=closeBox]'); if (b) closeBox(); });
  $('#tabs').addEventListener('click', paneClick);
  $('#pane').addEventListener('click', paneClick);
  $('#pane').addEventListener('input', paneInput);
  $('#pane').addEventListener('change', paneInput);
  $('#btnSound').addEventListener('click', () => setSound(!S.sound));
  $('#btnBox').addEventListener('click', () => openBox());
  $('#btnQuiz').addEventListener('click', () => startQuiz());
  $('#qGo').addEventListener('click', quizCheck);
  $('#qQuit').addEventListener('click', quizQuit);
  const cv = $('#cv');
  let down = null;
  cv.addEventListener('pointerdown', e => {
    if ($('#app').classList.contains('titled')) return;
    auInit();
    down = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10;
    down = null;
    if (moved) return;
    const r = cv.getBoundingClientRect();
    mapTap(e.clientX - r.left, e.clientY - r.top);
  });
  cv.addEventListener('pointercancel', () => { down = null; });
  if (window.ResizeObserver) {
    let lastTop = -1;
    new ResizeObserver(() => {
      const r = $('#card').getBoundingClientRect();
      if (!r.height || Math.abs(r.top - lastTop) < 4) return;
      const first = lastTop < 0; lastTop = r.top;
      if (!first) mapResize();
    }).observe($('#card'));
  }
  addEventListener('keydown', e => { if (e.key === 'Escape') back(); });
  addEventListener('resize', () => {
    clearTimeout(bindUI.rt);
    bindUI.rt = setTimeout(() => {
      mapResize(); markStrip(); drawRecs();
      if (!$('#viewer').hidden) { vSize(); VW.bg = VW.mode === 'comb' ? combCanvas(VW.size, VW.dpr) : clusterCanvas(VW.size, VW.dpr); spawnBees(); setDancers(); }
    }, 140);
  });
  document.addEventListener('visibilitychange', () => { if (AU.ctx) { if (document.hidden) AU.ctx.suspend().catch(() => {}); else if (S.sound) AU.ctx.resume().catch(() => {}); } });
}
let lastTs = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  requestAnimationFrame(loop);
  try {
    if (!M.paused) mapDraw(dt);
    if (!$('#viewer').hidden) vTick(dt);
  } catch (e) { if (!loop.warned) { loop.warned = true; console.error(e); } }
}
function boot() {
  if (window.__STANDALONE) { const h = $('#home'); if (h) h.hidden = true; }
  document.documentElement.style.setProperty('--fs', S.fs);
  renderStrip();
  M.sel = clamp(S.cur || 0, 0, LAST);
  select(M.sel);
  mapResize();
  bindUI();
  setSound(S.sound, true);
  $('#btnQuiz').hidden = !(isRead(4) || S.all);
  showTitle();
  voiceDetect();
  requestAnimationFrame(loop);
  window.__t = { S, CH, MAP, VW, TG, openViewer, openReader, startQuiz, select, markRead, danceFor, sunAt, dancesOf };
}
boot();

})();
</script>
