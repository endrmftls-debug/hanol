<style>
/* VOICE   a station attendant tells, plainly, the spring his daughter's silkworms opened his mother's silence
   IDEA    every chapter shows the box at that hour: the worms drawn to the size the rearing books give, eating, sleeping,
           spinning; the weight curve goes up ten thousand times; at the end one cocoon is reeled into a single thread
   PICTURE a shoebox, then trays and straw, seen from above on a night kitchen table; mulberry green and silk white
   TYPE    Gowun Batang for the story, Gowun Dodum for the notebook, Nanum Pen Script for the father's notes
   LAYOUT  phone: the box above, the chapter as a sheet at the bottom; laptop: the chapters as a column on the left */

:root{color-scheme:light dark;--paper:light-dark(#f6f0e5,#1b1815);--paper2:light-dark(#ece3d3,#26211c);--ink:light-dark(#272320,#ece6dc);--ink2:light-dark(#6a625a,#b2a99d);--rule:light-dark(#dcd1bd,#3a332c);--sea:light-dark(#3f6e36,#a7d08a);--seal:#c8452f;--ground:#1f1d18;--f-body:'Gowun Batang','Noto Serif KR',serif;--f-ui:'Gowun Dodum','Noto Sans KR',sans-serif;--f-pen:'Nanum Pen Script',cursive;--f-seal:'Song Myung','Gowun Batang',serif;--f-han:'Song Myung','Noto Serif KR','Noto Serif CJK KR',serif}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.6 var(--f-body);overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(40,32,26,.7);color:#f3ebdf;text-decoration:none;font:15px var(--f-ui);white-space:nowrap}
.tools{display:flex;gap:8px}
.ib{width:44px;height:44px;padding:0;border-radius:22px;border:0;background:rgba(40,32,26,.7);color:#f3ebdf;display:grid;place-items:center}
.ib svg,.chip svg,.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toast{position:absolute;z-index:40;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 58px);transform:translate(-50%,-10px);max-width:min(92vw,470px);padding:12px 18px;border-radius:14px;background:rgba(34,27,22,.94);color:#f5ecdf;font:15px/1.5 var(--f-ui);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* the ring board on the bench */
#hud{position:absolute;z-index:5;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 52px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:8px 8px 8px 12px;border-radius:14px;background:rgba(30,24,19,.78);color:#f1e7d9;font:13px/1.4 var(--f-ui);max-width:520px}
#hud .nm{font-size:14px;font-weight:700;color:#f6ecdd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .inf{color:#cdbfaa;font-size:12.5px}
#hud .pk{grid-column:1/-1;margin-top:3px;padding-top:5px;border-top:1px solid rgba(241,231,217,.14);color:#ffe2b8;min-height:1.4em}
#hud .hb{display:flex;gap:6px;grid-row:1/3;grid-column:2;align-items:center}
#hud .hb button{height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(241,231,217,.3);background:rgba(255,255,255,.06);color:#f1e7d9;font:13px var(--f-ui);white-space:nowrap}
#hud .hb #hudFeed{background:#cfe6a8;color:#20301a;border-color:#cfe6a8}
/* the chapter sheet */
.card{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;padding:4px 0 max(14px,env(safe-area-inset-bottom))}
.strip{display:flex;overflow-x:auto;gap:2px;padding:6px 10px 2px;scrollbar-width:none;scroll-behavior:smooth}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:50px;min-height:52px;border:0;border-radius:10px;background:none;color:var(--ink2);display:grid;justify-items:center;align-content:center;gap:5px;font:13px/1.1 var(--f-ui);padding:4px 0;font-variant-numeric:tabular-nums}
.strip .sw2{display:none}
.strip i{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;opacity:.45;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3.5px currentColor}
.strip .rd i{opacity:1}
.strip .on{color:var(--sea);background:var(--paper2)}
.strip .lk{opacity:.4}
.cb{padding:8px max(20px,env(safe-area-inset-left)) 0}
.cb .term{margin:0;font:14px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.cb h2{margin:2px 0 2px;font-size:clamp(30px,8.4vw,42px);line-height:1.08;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.cb .sub{margin:0;font-size:17px}
.cb .meta{margin:6px 0 0;font:14px var(--f-ui);color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.btn{height:48px;padding:0 22px;border-radius:24px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:700 17px var(--f-body);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn svg{width:20px;height:20px;stroke-width:1.8}
.note{font:14px var(--f-ui);color:var(--ink2);margin:10px 0 0}
.small{font:14px/1.6 var(--f-ui);color:var(--ink2)}
.link{border:0;background:none;padding:6px 0;color:var(--sea);font:15px var(--f-ui);text-decoration:underline;text-underline-offset:3px}
/* title */
#title{position:absolute;inset:0;z-index:20;display:grid;align-content:end;padding:0 max(22px,env(safe-area-inset-left)) max(34px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(24,19,15,0) 0%,rgba(24,19,15,.2) 36%,rgba(22,17,13,.94) 58%,rgba(22,17,13,.98) 100%);color:#f5ecdf;pointer-events:none}
#title .acts{pointer-events:auto}
#app.titled #card,#app.titled #hud{visibility:hidden}
#title .by{margin:0;font:15px var(--f-ui);opacity:.86}
#title h1{margin:6px 0 10px;font-size:clamp(40px,11vw,68px);line-height:1.05;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
#title .lead{margin:0;max-width:31em;font-size:17px;line-height:1.7;opacity:.93}
#title .acts .btn{background:#f5ecdf;color:#241c16;border-color:#f5ecdf}
#title .acts .btn.ghost{background:transparent;color:#f5ecdf}
#title .hint{margin:14px 0 0;font:14px var(--f-ui);opacity:.76}
/* reader */
#reader{position:absolute;inset:0;z-index:12;background:var(--paper);color:var(--ink);overflow-y:auto;overscroll-behavior:contain}
.rhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--paper);border-bottom:1px solid var(--rule)}
.rhead .ib{background:none;color:var(--ink)}
.rhead .rt{font:15px var(--f-ui);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rhead .grp{display:flex;gap:2px}
.rbody{max-width:660px;margin:0 auto;padding:26px max(20px,env(safe-area-inset-left)) 160px;font-size:calc(18px * var(--fs,1));line-height:1.86}
.rbody p{margin:0 0 1.05em}
.rbody p.han{font-family:var(--f-han);font-size:1.12em;letter-spacing:.08em;text-align:center;margin:1.2em 0;padding:.5em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.rbody .cal{margin:0 0 .35em;padding-left:1em;border-left:3px solid color-mix(in srgb,var(--seal) 55%,transparent);font-family:var(--f-ui);font-size:.92em;line-height:1.6}
.chead{margin:4px 0 34px}
.chead .cl{margin:0;font:15px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.chead h1{margin:4px 0 6px;font-size:clamp(36px,9vw,52px);line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
.chead .cs{margin:0;font-size:1.05em}
.brk{display:block;text-align:center;margin:1.8em 0;color:var(--ink2);letter-spacing:.6em}
.speaking{background:color-mix(in srgb,#d9a35f 26%,transparent);border-radius:3px;box-shadow:0 0 0 4px color-mix(in srgb,#d9a35f 26%,transparent)}
/* a page of the ring notebook */
.rec{position:relative;margin:2.6em 0 1.6em;padding:16px 16px 18px;border:1px solid var(--rule);border-radius:6px;background:var(--paper2);font-family:var(--f-ui)}
.rec .rh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:13px;color:var(--ink2);letter-spacing:.04em}
.rec .rw{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:14px;align-items:start}
.rec canvas{width:100%;aspect-ratio:1;border-radius:6px;background:#26241f;display:block;cursor:pointer}
.rec dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px;font-size:.84em;line-height:1.55}
.rec dt{color:var(--ink2);padding:5px 0;border-bottom:1px solid var(--rule)}
.rec dd{margin:0;padding:5px 0;border-bottom:1px solid var(--rule)}
.rec dd.han{font-family:var(--f-han);letter-spacing:.04em}
.rec dd.han .tr{display:block;margin-top:4px;font-family:var(--f-ui);letter-spacing:0;color:var(--ink2);font-size:.94em}
.rec .quote{margin:14px 0 0;padding:10px 14px;border-left:3px solid var(--seal);background:light-dark(#fbf7f0,#201c18);font:1.02em/1.6 var(--f-body)}
.rec .memo{margin:12px 0 0;font:1.32em/1.5 var(--f-pen);color:var(--sea);background-image:linear-gradient(transparent calc(1.5em - 1px),var(--rule) calc(1.5em - 1px));background-size:100% 1.5em}
.rec .memo p{margin:0}
.rec .ra{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rec .ra button{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--rule);background:var(--paper);font:14px var(--f-ui);display:inline-flex;align-items:center;gap:6px}
.rec .ra svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:420px){.rec .rw{grid-template-columns:1fr}.rec canvas{width:min(100%,260px);justify-self:center}}
.cend{margin-top:56px;padding-top:24px;border-top:1px solid var(--rule);display:grid;gap:14px;justify-items:start}
.cend .done{display:flex;align-items:center;gap:12px;color:var(--ink2);font:15px var(--f-ui)}
.stamp{display:inline-grid;place-items:center;width:58px;height:58px;border:2px solid var(--seal);color:var(--seal);font:700 17px/1 var(--f-seal);border-radius:50%;transform:rotate(-8deg);opacity:.9}
.stampfx{animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(1.6) rotate(-16deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:.9}}
/* narration */
#player{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:28px;background:var(--ink);color:var(--paper);max-width:calc(100vw - 24px)}
#player .ib{background:none;color:var(--paper)}
#player .rate{width:auto;padding:0 12px;font:15px var(--f-ui)}
#player .pt{font:14px var(--f-ui);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
/* the box */
#box{position:absolute;inset:0;z-index:11;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;justify-content:space-between;padding:max(6px,env(safe-area-inset-top)) 8px 0 max(18px,env(safe-area-inset-left))}
.bhead h2{margin:0;font-size:22px}
.bhead .ib{background:none;color:var(--ink)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:48px;padding:0 13px;border:0;border-bottom:2px solid transparent;background:none;font:16px var(--f-ui);color:var(--ink2)}
.tabs button[aria-selected=true]{color:var(--sea);border-bottom-color:var(--sea)}
.pane{flex:1;overflow-y:auto;padding:14px max(18px,env(safe-area-inset-left)) 120px}
.toc{list-style:none;margin:0;padding:0}
.toc li+li{border-top:1px solid var(--rule)}
.toc button{width:100%;min-height:62px;border:0;background:none;display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:8px 2px}
.toc .t1{font:14px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.toc .t2{font-size:18px;font-weight:700;line-height:1.25}
.toc .t3{display:block;font:14px var(--f-ui);font-weight:400;color:var(--ink2)}
.toc .sm{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--seal);color:var(--seal);border-radius:50%;font:700 12px/1 var(--f-seal);transform:rotate(-8deg)}
.toc .lk{opacity:.45}
.toc .cur .t2{color:var(--sea)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.6em,1fr));gap:12px;margin-top:12px}
.album button{border:0;padding:0;background:none;text-align:left;display:grid;gap:4px;font:13px/1.4 var(--f-ui);color:var(--ink2)}
.album canvas{width:100%;aspect-ratio:1;border-radius:8px;background:#26241f;display:block}
.album .ph{width:100%;aspect-ratio:1;border-radius:8px;background:var(--paper2);display:grid;place-items:center;font:14px var(--f-ui);color:var(--ink2);text-align:center;padding:8px}
.album b{color:var(--ink);font-size:15px}
.album button:disabled{cursor:default;opacity:.55}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:6px 14px;font:14px var(--f-ui);color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend b{color:var(--ink);font-weight:400}
.gfil{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.gfil button{height:38px;padding:0 13px;border-radius:19px;border:1.5px solid var(--rule);background:none;font:14px var(--f-ui)}
.gfil button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.gsearch{width:100%;font:16px var(--f-ui);padding:11px 12px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper)}
.gl{list-style:none;margin:8px 0 0;padding:0}

/* the overlay: weight curve, line map, reeling */
#ov{position:absolute;z-index:14;left:0;right:0;top:0;bottom:0;background:#1d1b17;color:#f1e9da;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#ov>*{flex:none}

.ph2{display:flex;align-items:center;justify-content:space-between;gap:10px}

.tsub{margin:0;font:13px/1.55 var(--f-ui);color:#cdbfaa}

.tnow{margin:0;font:15px/1.55 var(--f-ui);min-height:3.1em}

@media (min-width:900px){
  .card{left:max(16px,env(safe-area-inset-left));right:auto;top:max(16px,env(safe-area-inset-top));bottom:max(16px,env(safe-area-inset-bottom));width:420px;border-radius:18px;display:flex;flex-direction:column;padding:10px 0 18px}
  .strip{flex-direction:column;overflow-x:hidden;overflow-y:auto;flex:1;padding:4px 14px;gap:0}
  .strip button{width:auto;min-height:40px;display:grid;grid-template-columns:3.6em 12px minmax(0,1fr);justify-items:start;align-items:center;text-align:left;gap:10px;font-size:14px;padding:4px 10px}
  .strip .sw2{display:block;font:16px var(--f-body);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .strip .on .sw2{color:var(--sea)}

/* ---------- 누에 셈: silkdata.py 와 같은 셈 ---------- */

    else { const p = segParams(s); list.push({ id, text: s.text, voice: p.name, rate: p.rate, pitch: p.pitch, vol: 1 }); }
  }
  try { window.NightVoice.enqueue(JSON.stringify(list)); } catch (e) { vFail(); }
}
window.__voiceEvent = (type, id) => {
  if (type === 'ready') { if (NV.kind !== 'web') voiceDetect(); return; }
  const p = String(id).split(':'), tk = +p[0], ix = +p[1];
  if (tk !== NV.tok || !NV.on || NV.paused || !(ix >= 0)) return;
  if (type === 'start') {
    segStart(ix);
    if (ix === NV.segs.length - 1) { clearTimeout(NV.endT); NV.endT = setTimeout(() => { if (tk === NV.tok && NV.on && !NV.paused) chapterEnded(NV.n); }, NV.segs[ix].gap / rateK() + 2500); }
  } else {
    const s = NV.segs[ix];
    if (type === 'error' && s && s.text) { if (++NV.err >= 3) { vFail(); return; } } else if (s && s.text) NV.err = 0;
    NV.idx = ix + 1;
    if (ix >= NV.segs.length - 1) chapterEnded(NV.n);
  }
};
function webNext(tok) {
  if (tok !== NV.tok || !NV.on || NV.paused) return;
  if (NV.idx >= NV.segs.length) { chapterEnded(NV.n); return; }
  const i = NV.idx, s = NV.segs[i];
  segStart(i);
  if (s.gap) { NV.timer = setTimeout(() => { if (tok !== NV.tok) return; NV.idx = i + 1; webNext(tok); }, s.gap / rateK()); return; }
  const p = segParams(s), u = new SpeechSynthesisUtterance(s.text);
  u.lang = 'ko-KR';
  if (p.obj) u.voice = p.obj;
  u.rate = p.rate; u.pitch = p.pitch; u.volume = 1;
  const cur = { fired: false, started: false, t0: Date.now(), kick: Date.now(), net: p.net, name: p.name };
  cur.fin = (ok, why) => {
    if (cur.fired) return;
    cur.fired = true;
    if (tok !== NV.tok) return;
    if (!ok) {
      if (cur.net && cur.name && !NV.bad.has(cur.name) && why !== 'not-allowed') { NV.bad.add(cur.name); resolveRoles(); NV.timer = setTimeout(() => webNext(tok), 150); return; }
      if (++NV.err >= 3) { vFail(); return; }
    } else NV.err = 0;
    NV.idx = i + 1;
    NV.timer = setTimeout(() => webNext(tok), 30);
  };
  u.onstart = () => { cur.started = true; };
  u.onend = () => cur.fin(true);
  u.onerror = e => { const w = e && e.error; cur.fin(w === 'interrupted' || w === 'canceled', w); };
  NV.cur = cur; NV.utt = u;
  try { speechSynthesis.speak(u); } catch (e) { cur.fin(false); }
}
function webWatchdog() {
  clearInterval(NV.dog);
  if (NV.kind !== 'web') return;
  const desktop = !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  NV.dog = setInterval(() => {
    const c = NV.cur;
    if (!NV.on || NV.paused || !c || c.fired) return;
    let speaking = true;
    try { speaking = speechSynthesis.speaking || speechSynthesis.pending; } catch (e) { speaking = false; }
    const age = Date.now() - c.t0;
    if (!speaking && ((c.started && age > 1200) || age > 8000)) c.fin(true);
    else if (desktop && /^Google/.test(c.name) && Date.now() - c.kick > 10000) { c.kick = Date.now(); try { speechSynthesis.pause(); speechSynthesis.resume(); } catch (e) { /* ignore */ } }
  }, 1200);
}
function segStart(i) {
  const s = NV.segs[i];
  if (!s) return;
  NV.idx = i;
  if (s.u != null && !s.gap) highlight(s.u);
  if (s.text) $('#pText').textContent = s.text;
}
function highlight(u) {
  const el = $(`#rBody [data-u="${u}"]`);
  if (el === NV.hi) return;
  if (NV.hi) NV.hi.classList.remove('speaking');
  NV.hi = el;
  if (!el) return;
  el.classList.add('speaking');
  if (Date.now() - NV.userScroll < 5000) return;
  const r = el.getBoundingClientRect();
  if (r.top < 70 || r.bottom > innerHeight - 110) el.scrollIntoView({ block: 'center', behavior: M.reduce ? 'auto' : 'smooth' });
}

/* ---------- starting, pausing, moving about ---------- */
function vUnlock() {
  if (NV.kind === 'native' || window.NightVoice || !('speechSynthesis' in window) || vUnlock.done) return;
  vUnlock.done = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'ko-KR'; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
}
function vStart(n, fromU) {
  if (!vSupported()) { toast(whyMsg(), 6500); return; }
  vUnlock();
  auInit();
  NV.n = n;
  NV.segs = buildSegs();
  NV.idx = 0;
  if (fromU != null) { const k = NV.segs.findIndex(s => s.u === fromU && s.text); if (k >= 0) NV.idx = k; }
  NV.on = true; NV.paused = false; NV.tok++; NV.err = 0; NV.userScroll = 0;
  vHalt(); vRun(); webWatchdog();
  $('#player').hidden = false; playerUpdate();
  document.body.classList.add('narr');
  auApply(); wake(true);
}
function vPause() { if (!NV.on || NV.paused) return; NV.paused = true; NV.tok++; vHalt(); playerUpdate(); auApply(); }
function vResume() { if (!NV.on || !NV.paused) return; NV.paused = false; NV.tok++; const s = NV.segs[NV.idx]; if (s && s.gap) NV.idx++; vRun(); playerUpdate(); auApply(); }
function vStop() {
  NV.tok++; clearTimeout(NV.timer);
  if (!NV.on && $('#player').hidden) return;
  NV.on = false; NV.paused = false;
  vHalt(); clearInterval(NV.dog);
  document.body.classList.remove('narr');
  if (NV.hi) { NV.hi.classList.remove('speaking'); NV.hi = null; }
  $('#player').hidden = true;
  auApply(); wake(false);
}
function vFail() { vStop(); toast('목소리가 자꾸 끊깁니다. 설정에서 다른 목소리를 골라 보세요.', 6000); }
function vGoto(i) { NV.idx = clamp(i, 0, NV.segs.length - 1); NV.tok++; vHalt(); if (NV.paused) { NV.paused = false; } vRun(); playerUpdate(); }
function vSkip(dir) {
  const cur = NV.segs[NV.idx], u = cur ? cur.u : 0;
  let i = NV.idx;
  if (dir > 0) { while (i < NV.segs.length && !(NV.segs[i].text && NV.segs[i].u > u)) i++; }
  else { const target = Math.max(0, (u || 0) - 1); i = NV.segs.findIndex(s => s.text && s.u >= target); }
  if (i < 0 || i >= NV.segs.length) return;
  vGoto(i);
}
function vJump(u) { const i = NV.segs.findIndex(s => s.text && s.u === u); if (i >= 0) vGoto(i); }
function listenTap() {
  if (NV.on) { NV.paused ? vResume() : vPause(); return; }
  const n = S.cur, top = $('.rhead').getBoundingClientRect().bottom + 8;
  const first = $$('#rBody [data-u]').find(el => el.getBoundingClientRect().bottom > top);
  vStart(n, first && $('#reader').scrollTop > 40 ? +first.dataset.u : null);
}
function chapterEnded(n) {
  if (NV.n !== n || !NV.on) return;
  if (n >= LAST) { vStop(); if (!isRead(n)) stampHere(n); const f = $('#rBody .cend'); if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (!isRead(n)) stampHere(n);
  const tok = ++NV.tok;
  toast(`다음 장, ${CH[n + 1].title}`);
  NV.timer = setTimeout(() => { if (tok !== NV.tok || !NV.on) return; openReader(n + 1, true); }, 2800);
}
function playerUpdate() {
  const t = $('#pToggle');
  t.setAttribute('aria-label', NV.paused ? '이어 읽기' : '멈춤');
  t.querySelector('.pp').setAttribute('d', NV.paused ? 'M8 5l11 7-11 7z' : 'M9 6v12M15 6v12');
  $('#pRate').textContent = `${(+S.vrate).toFixed(2).replace(/0$/, '').replace(/\.0$/, '')}×`;
}
const RATES = [0.85, 1, 1.15, 1.3];
function playerAct(a) {
  if (a === 'toggle') NV.paused ? vResume() : vPause();
  else if (a === 'stop') vStop();
  else if (a === 'next') vSkip(1);
  else if (a === 'prev') vSkip(-1);
  else if (a === 'rate') {
    const i = RATES.findIndex(r => r >= (+S.vrate) - 0.01);
    S.vrate = RATES[(i + 1) % RATES.length]; save();
    if (NV.on && !NV.paused) vGoto(NV.idx);
    playerUpdate();
  }
}
async function wake(on) {
  try { if (window.NightVoice && window.NightVoice.awake) window.NightVoice.awake(!!on); } catch (e) { /* ignore */ }
  try {
    if (on && 'wakeLock' in navigator && !NV.lock) { NV.lock = await navigator.wakeLock.request('screen'); NV.lock.addEventListener('release', () => { NV.lock = null; }); }
    else if (!on && NV.lock) { await NV.lock.release(); NV.lock = null; }
  } catch (e) { NV.lock = null; }
}
function voiceSetHTML() {
  if (!vSupported()) return `<p class="small">${esc(whyMsg())}</p>`;
  if (!NV.voices.length) return '<p class="small">기기의 기본 한국어 목소리로 읽습니다.</p>';
  const opt = sel => NV.voices.map(v => `<option value="${esc(v.name)}"${sel && sel.name === v.name ? ' selected' : ''}>${esc(v.name.replace(/^Microsoft |^Google /, ''))}${v.net ? ' (온라인)' : ''}</option>`).join('');
  return `<div class="row"><label for="vA">아빠의 목소리</label><select id="vA" data-v="vA">${opt(VR.A)}</select></div>
    <div class="row"><label for="vC">일지의 목소리</label><select id="vC" data-v="vC">${opt(VR.C)}</select></div>
    <p class="small">장 끝의 누에 일지는 다른 목소리로 읽습니다.</p>`;
}

function firstUnread() { for (let n = 0; n <= LAST; n++) if (!isRead(n)) return n; return LAST; }
function showTitle() {
  const nx = firstUnread(), any = S.read.some(Boolean), all = CH.every((c, n) => isRead(n));
  $('#tActs').innerHTML = all
    ? `<button class="btn" data-t="reel">${ICON.reel}실 켜기</button><button class="btn ghost" data-t="look">상자 들여다보기</button>`
    : any
    ? `<button class="btn" data-t="resume">이어 읽기 · ${esc(CH[nx].title)}</button><button class="btn ghost" data-t="look">상자 들여다보기</button>`
    : `<button class="btn" data-t="start">읽기 시작</button><button class="btn ghost" data-t="look">상자 들여다보기</button>`;
  $('#title').hidden = false; $('#app').classList.add('titled');
  VW.title = true;
  // the title shows the fifth instar at its height, eating
  setSceneT(22.42, 10, true);
  viewResize(); hudUpdate();
}
function leaveTitle() {
  hideTitle(); VW.title = false; viewResize(); viewSet(); hudUpdate();
}
function back() {
  if (OV.on) { ovClose(); return; }
  if (!$('#box').hidden) { closeBox(); return; }
  if (!$('#reader').hidden) { closeReader(); return; }
}
let resetArm = 0;
function act(a, el) {
  switch (a) {
    case 'read': openReader(M.sel); break;
    case 'listen': if (el && el.closest('#reader')) listenTap(); else openReader(M.sel, true); break;
    case 'toView': closeReader(); closeBox(); ovClose(); viewSet(); break;
    case 'chart': ovOpen('chart'); break;
    case 'map': ovOpen('map'); break;
    case 'reel': ovOpen('reel'); break;
    case 'stamp': stampHere(S.cur); break;
    case 'nextCh': openReader(S.cur + 1); break;
    case 'closeReader': closeReader(); break;
    case 'closeBox': closeBox(); break;
    case 'closeOv': ovClose(); break;
    case 'fsDown': setFS(S.fs - 0.05); break;
    case 'fsUp': setFS(S.fs + 0.05); break;
    case 'sound': setSound(!S.sound, true); renderPane(); break;
    case 'all': S.all = !S.all; save(); renderStrip(); updateCard(); renderPane(); break;
    case 'reset':
      if (Date.now() - resetArm > 4000) { resetArm = Date.now(); el.textContent = '정말 지울까요? 한 번 더 누르세요'; break; }
      S.read = []; S.cur = 0; S.started = false; S.all = false; S.fed = 0; S.reels = []; save();
      renderStrip(); select(0); renderPane(); closeBox(); showTitle(); toast('처음으로 되돌렸습니다. 다시 알 서른 개입니다.');
      break;
  }
}
function paneClick(e) {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; renderPane(); return; }
  if (t.dataset.open != null) { closeBox(); ovClose(); openReader(+t.dataset.open); return; }
  if (t.dataset.day != null) { closeBox(); select(+t.dataset.day); return; }
  if (t.dataset.gf != null) { GF = t.dataset.gf; renderPane(); return; }
  if (t.dataset.act) act(t.dataset.act, t);
}
function paneInput(e) {
  const t = e.target;
  if (t.id === 'gsq') { GQ = t.value; const pos = t.selectionStart; renderPane(); const q = $('#gsq'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } } }
  else if (t.id === 'vr') { S.vrate = +t.value; save(); if (NV.on) playerUpdate(); }
  else if (t.id === 'fsr') setFS(+t.value);
  else if (t.dataset.v) { S[t.dataset.v] = t.value; save(); resolveRoles(); }
}
function bindUI() {
  $('#strip').addEventListener('click', e => { const b = e.target.closest('button[data-n]'); if (b) select(+b.dataset.n); });
  $('#cbInner').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b); });
  $('#tActs').addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    auInit(); S.started = true; save();
    leaveTitle();
    if (b.dataset.t === 'start') openReader(0);
    else if (b.dataset.t === 'resume') openReader(firstUnread());
    else if (b.dataset.t === 'reel') ovOpen('reel');
  });
  $('#reader').addEventListener('click', e => {
    const cv = e.target.closest('canvas[data-mini]');
    if (cv) { closeReader(); select(+cv.dataset.mini); return; }
    const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b);
  });
  $('#reader').addEventListener('scroll', () => { NV.userScroll = Date.now(); }, { passive: true });
  $('#rBody').addEventListener('dblclick', e => { const p = e.target.closest('[data-u]'); if (p && NV.on) vJump(+p.dataset.u); });
  $('#player').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) playerAct(b.dataset.p); });
  $('#box').addEventListener('click', e => { const b = e.target.closest('[data-act=closeBox]'); if (b) closeBox(); });
  $('#tabs').addEventListener('click', paneClick);
  $('#pane').addEventListener('click', paneClick);
  $('#pane').addEventListener('input', paneInput);
  $('#pane').addEventListener('change', paneInput);
  $('#btnSound').addEventListener('click', () => setSound(!S.sound));
  $('#btnBox').addEventListener('click', () => openBox());
  $('#btnChart').addEventListener('click', () => ovOpen('chart'));
  $('#btnMap').addEventListener('click', () => ovOpen('map'));
  $('#hudFeed').addEventListener('click', () => { auInit(); feed(); });
  $('#hudGrow').addEventListener('click', () => { auInit(); growPlay(); });
  $('#ov').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (b) { act(b.dataset.act, b); return; }
    const o = e.target.closest('[data-open]'); if (o) { ovClose(); openReader(+o.dataset.open); }
  });
  const oc = $('#ovc');
  let odown = false;
  const ovPt = e => { const r = oc.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  oc.addEventListener('pointerdown', e => { odown = true; const [x, y] = ovPt(e); if (OV.mode === 'chart') { OV.hover = chartPoint(x); ovDraw(); } else if (OV.mode === 'map') mapTap(x, y); else if (OV.mode === 'reel') { RL.hold = true; auInit(); } try { oc.setPointerCapture(e.pointerId); } catch (x2) { /* ignore */ } });
  oc.addEventListener('pointermove', e => { const [x] = ovPt(e); if (OV.mode === 'chart' && (odown || e.pointerType === 'mouse')) { OV.hover = chartPoint(x); ovDraw(); } });
  const up = () => { odown = false; if (OV.mode === 'reel') RL.hold = false; };
  oc.addEventListener('pointerup', up); oc.addEventListener('pointercancel', up);
  const cv = $('#cv');
  let down = null;
  cv.addEventListener('pointerdown', e => {
    if ($('#app').classList.contains('titled')) return;
    auInit();
    down = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8; down = null;
    if (!moved) viewTap(e.clientX, e.clientY);
  });
  cv.addEventListener('pointercancel', () => { down = null; });
  if (window.ResizeObserver) {
    let lastTop = -1;
    new ResizeObserver(() => {
      const r = $('#card').getBoundingClientRect();
      if (!r.height || Math.abs(r.top - lastTop) < 4) return;
      const first = lastTop < 0; lastTop = r.top;
      if (!first) viewResize();
    }).observe($('#card'));
  }
  addEventListener('keydown', e => { if (e.key === 'Escape') back(); });
  addEventListener('resize', () => {
    clearTimeout(bindUI.rt);
    bindUI.rt = setTimeout(() => { viewResize(); markStrip(); drawMinis(); if (OV.on) ovResize(); }, 140);
  });
  document.addEventListener('visibilitychange', () => { if (AU.ctx) { if (document.hidden) AU.ctx.suspend().catch(() => {}); else if (S.sound) AU.ctx.resume().catch(() => {}); } });
}
let lastTs = 0, audT = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  requestAnimationFrame(loop);
  try {
    if (!M.paused || VW.title) viewDraw(dt);
    audT += dt; if (audT > 0.4) { audT = 0; auApply(); if (VW.tl) hudUpdate(); }
  } catch (e) { if (!loop.warned) { loop.warned = true; console.error(e); } }
}
function boot() {
  if (window.__STANDALONE) { const h = $('#home'); if (h) h.hidden = true; }
  document.documentElement.style.setProperty('--fs', S.fs);
  renderStrip();
  M.sel = clamp(S.cur || 0, 0, LAST);
  bindUI();
  M.w = innerWidth; M.h = innerHeight;
  select(M.sel);
  setSound(S.sound, true);
  showTitle();
  voiceDetect();
  requestAnimationFrame(loop);
  window.__t = { S, CH, D, VW, OV, RL, openReader, select, markRead, viewSet, setSceneT, growPlay, feed, ovOpen, ovClose, buildScene, lenAt, wtAt, leafAt, stageAt, aliveAt };
}
boot();

})();
</script>
