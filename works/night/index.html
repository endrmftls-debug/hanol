<title>밤을 깁는 사람</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE occasion: a hushed, tender night story that rewards slow reading
   IDEA the mender's ledger and the night-cloth itself: woven indigo, dashed basting thread, a thimble
   PICTURE the whole screen is the turning sky over the summit loft; constellations get sewn in as you read
   COLOUR ink-indigo night, unbleached cotton thread, one breath of dawn violet-blue, a red needle tip
   TYPE Song Myung for names and titles, Gowun Batang for reading
   LAYOUT sky fills every width; quiet top bar; one stitched button below; the ledger opens as a sheet over the sky */
:root{color-scheme:dark;--night:#070a17;--night2:#0d1430;--panel:rgba(12,17,38,.9);--cotton:#ebe4d3;--dim:#b3ad9f;--thread:#dccfb0;--dawn:#cfd5f4;--hong:#e46b5b;--fs:1;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:dark}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--cotton);font:16px/1.6 "Gowun Batang","Noto Serif KR","Nanum Myeongjo","Noto Serif CJK KR",serif;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#sky.drag{cursor:grabbing}
.place canvas#sky{cursor:crosshair}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,rgba(7,10,23,0) 55%,rgba(4,6,14,.55) 100%)}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(10px + var(--safe-t)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(6,8,19,.82),rgba(6,8,19,0));pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand .bt{font-family:"Song Myung","Gowun Batang",serif;font-size:21px;line-height:1.15;letter-spacing:.01em}
.nl{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:13.5px;color:var(--dim)}
.moon-ic{width:15px;height:15px;flex:none}
.tools{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(18,25,56,.62);border:1px solid rgba(235,228,211,.2);cursor:pointer;padding:0;transition:background .2s,border-color .2s}
.ib:hover{background:rgba(30,40,84,.8)}
.ib:focus-visible,.sbtn:focus-visible,.row:focus-visible,.lnk:focus-visible,.chip:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
.ib svg{width:21px;height:21px}
.ib[aria-pressed=true]{border-color:rgba(220,207,176,.75);background:rgba(40,46,86,.8)}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px calc(14px + var(--safe-b));background:linear-gradient(rgba(6,8,19,0),rgba(6,8,19,.7));pointer-events:none;z-index:4;transition:opacity .35s}
.bottom>*{pointer-events:auto}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:11px 22px;border-radius:999px;border:1.5px dashed rgba(220,207,176,.75);background:rgba(14,20,46,.88);cursor:pointer;font-size:16px;line-height:1.3;text-align:center;transition:background .2s,transform .15s}
.sbtn:hover{background:rgba(26,34,72,.95)}
.sbtn:active{transform:scale(.98)}
.sbtn svg{width:18px;height:18px;flex:none}
.sbtn.solid{background:var(--cotton);color:#0c1028;border-style:solid;border-color:var(--cotton)}
.sbtn.solid:hover{background:#fff6e4}
.sbtn.ghost{border-color:rgba(235,228,211,.28);background:transparent}
.hint{margin:0;font-size:13.5px;color:var(--dim);text-align:center;max-width:30em;transition:opacity .8s}
.tip{position:fixed;z-index:6;left:0;top:0;max-width:240px;padding:7px 11px;border-radius:10px;background:rgba(8,11,27,.92);border:1px dashed rgba(220,207,176,.55);font-size:13.5px;line-height:1.45;pointer-events:none;transform:translate(-50%,calc(-100% - 16px));white-space:normal;word-break:keep-all}
.tip small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.card{position:fixed;z-index:7;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);width:min(560px,calc(100% - 24px));max-height:min(50vh,470px);overflow:auto;padding:18px 18px 14px;border-radius:18px;background:var(--panel);border:1px solid rgba(235,228,211,.14);box-shadow:0 14px 44px rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.card h2{font-family:"Song Myung","Gowun Batang",serif;font-weight:400;font-size:25px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
.card .meta{font-size:13.5px;color:var(--dim);margin:0 0 10px}
.card p{margin:0 0 10px;font-size:15px;line-height:1.72;word-break:keep-all}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.card .acts .sbtn{font-size:15px;min-height:44px;padding:9px 18px}
.card .x{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:transparent;border-radius:50%;cursor:pointer;color:var(--dim)}
.card .x svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:nowrap;gap:6px;margin:6px -18px 0;padding:0 18px 6px;list-style:none;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips li{flex:none}
.chip{font-size:13.5px;line-height:1.35;padding:7px 12px;min-height:36px;white-space:nowrap;border-radius:999px;border:1px dashed rgba(220,207,176,.4);color:#ddd6c6;background:transparent;cursor:pointer;text-align:left;word-break:keep-all}
.chip.on{border-style:solid;border-color:var(--thread);color:var(--cotton)}
textarea{width:100%;min-height:76px;resize:vertical;font:16px/1.6 "Gowun Batang",serif;color:var(--cotton);background:rgba(6,9,22,.7);border:1px solid rgba(235,228,211,.3);border-radius:10px;padding:10px 12px}
textarea:focus{outline:2px solid var(--dawn);outline-offset:1px}
.banner .lnk{white-space:nowrap;flex:none}
.banner{position:fixed;z-index:6;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 10px 10px 16px;border-radius:14px;background:rgba(14,20,46,.9);border:1.5px dashed rgba(220,207,176,.65);font-size:15px;line-height:1.5}
.toast{position:fixed;z-index:9;left:50%;top:calc(80px + var(--safe-t));transform:translateX(-50%);width:max-content;max-width:min(420px,calc(100% - 32px));padding:8px 15px;border-radius:16px;background:rgba(10,14,32,.92);border:1px solid rgba(220,207,176,.35);font-size:14px;line-height:1.5;text-align:center;animation:fade 5.1s ease forwards;pointer-events:none;word-break:keep-all}
@keyframes fade{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
.reader,.panel{position:fixed;inset:0;z-index:10;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#070a16;animation:open .35s ease-out}
.intro .top,.intro .bottom{opacity:0;pointer-events:none}
.intro .top *,.intro .bottom *{pointer-events:none}
.ov .top,.ov .bottom,.ov .vig{visibility:hidden}
@keyframes open{from{opacity:0}to{opacity:1}}
.sheet{max-width:37em;margin:0 auto;padding:calc(70px + var(--safe-t)) 22px calc(90px + var(--safe-b))}
.rbar{position:fixed;z-index:11;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 12px 10px;background:linear-gradient(rgba(7,10,22,.98) 60%,rgba(7,10,22,0));pointer-events:none}
.rbar>*{pointer-events:auto}
.rbar .grp{display:flex;gap:6px;align-items:center}
.rbar .prog{font-size:13px;color:var(--dim);padding:0 6px}
.lnk{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:14px;padding:10px 8px;min-height:44px}
.rh{margin-bottom:28px}
.rh .num{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);margin:0 0 10px}
.rh .num .moon-ic{width:17px;height:17px}
.rh h1{font-family:"Song Myung","Gowun Batang",serif;font-weight:400;font-size:clamp(36px,10vw,52px);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
.rh .sub{margin:12px 0 0;font-size:16px;color:var(--dim)}
.plate{display:block;width:min(100%,340px);height:auto;margin:22px auto 0;overflow:visible}
.colo p{font-size:15.5px;line-height:1.85;color:#ddd6c6;margin:12px 0 0;word-break:keep-all}
.colo .cred{font-size:13px!important;color:#8f8a7c!important}
.colo .sig{text-align:right;color:var(--dim);font-family:"Song Myung",serif;font-size:17px}
.rule{height:0;border-top:1.5px dashed rgba(220,207,176,.4);margin:22px 0 0}
.rb{font-size:calc(17.5px * var(--fs));line-height:1.95;word-break:keep-all;overflow-wrap:break-word}
.rb p{margin:0 0 1.05em}
.rb .frame+.ledger,.rb .ledger+.frame{margin-top:2.2em}
.ledger{position:relative;margin-inline:-8px;padding:1.3em 1.15em 1em 1.75em;border-radius:6px;background:linear-gradient(#10173a,#0d1430);box-shadow:inset 0 0 0 1px rgba(235,228,211,.07)}
.ledger::before{content:"";position:absolute;left:.75em;top:1.1em;bottom:1.1em;border-left:1.5px dashed rgba(220,207,176,.45)}
.ledger .tag{font-size:.74em;color:#a79f8c;margin:0 0 .7em;letter-spacing:.02em}
.ledger p{color:#e4ddcd}
.ledger .lh{font-size:.86em;line-height:1.75;color:#cdc1a2;padding-bottom:.85em;margin-bottom:1.1em;border-bottom:1px dashed rgba(220,207,176,.3)}
.ledger .note{font-size:.93em;color:#cfc8b7;padding-left:.9em;border-left:2px dotted rgba(220,207,176,.42)}
.ledger.dok p{color:#e7dccb}
.ledger.old{background:linear-gradient(#141a33,#10152b)}
.ledger.gyeol{background:linear-gradient(#121a3c,#0f1735)}
.q{margin:1.4em 0;padding:1em 1.15em;border:1px solid rgba(220,207,176,.26);border-radius:4px;background:rgba(255,255,255,.025);line-height:1.85}
.q p{margin:0}
.q p+p{margin-top:.3em}
.q p:last-child:not(:first-child){text-align:right;color:#cbbf9f}
.ll{list-style:none;margin:0 0 1.1em;padding:0}
.ll li{position:relative;padding-left:1.5em;margin:.5em 0}
.ll li::before{content:"";position:absolute;left:.1em;top:.95em;width:.8em;border-top:1.5px dashed rgba(220,207,176,.65)}
.brk{display:flex;justify-content:center;gap:14px;margin:2em 0;color:#8f8878}
.brk i{width:18px;border-top:1.5px dashed rgba(220,207,176,.5)}
.sl{margin:1.6em 0 0;padding:1em 0 0;border-top:1px dashed rgba(220,207,176,.25)}
.sl h3{font-weight:400;font-size:.82em;color:#b6ab92;margin:0 0 .6em;letter-spacing:.02em}
.sl ol{margin:0;padding:0;list-style:none;counter-reset:s}
.sl li{counter-increment:s;position:relative;padding-left:2em;margin:.35em 0;font-size:.9em;line-height:1.65;color:#d8d1c0}
.sl li::before{content:counter(s);position:absolute;left:0;top:.05em;width:1.45em;height:1.45em;border-radius:50%;border:1px dashed rgba(220,207,176,.55);font-size:.72em;display:grid;place-items:center;color:#cdbf9e}
.special{margin:1.6em 0 0;display:flex;flex-wrap:wrap;gap:8px}
.rend{margin-top:3em;display:flex;flex-direction:column;gap:10px}
.rend .sbtn{width:100%}
.rend .after{font-size:14px;color:var(--dim);text-align:center;margin:4px 0 0}
.panel .sheet{max-width:40em}
.panel h1{font-family:"Song Myung","Gowun Batang",serif;font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.08;margin:0 0 8px;letter-spacing:-.02em}
.panel .lead{color:var(--dim);margin:0 0 18px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 26px}
.stat{padding:12px 12px;border:1px dashed rgba(220,207,176,.35);border-radius:12px}
.stat b{display:block;font-family:"Song Myung",serif;font-weight:400;font-size:clamp(21px,5.6vw,28px);line-height:1.1;white-space:nowrap}
.stat span{font-size:13px;color:var(--dim)}
.part{margin:26px 0 6px}
.part h2{font-family:"Song Myung","Gowun Batang",serif;font-weight:400;font-size:22px;margin:0;line-height:1.3}
.part p{margin:2px 0 0;font-size:13.5px;color:var(--dim)}
.row{display:grid;grid-template-columns:4.1em minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:12px 4px;border:0;border-bottom:1px dashed rgba(235,228,211,.1);background:transparent;cursor:pointer;text-align:left;min-height:56px}
.row:hover{background:rgba(255,255,255,.03)}
.row .n{font-size:13.5px;color:var(--dim);white-space:nowrap}
.row .t{font-size:17px;line-height:1.35}
.row .t small{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.row svg{width:24px;height:24px}
.row.cur .n{color:var(--hong)}
.mlist{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.mlist .chip{white-space:normal}
details{margin:26px 0 0;border-top:1px dashed rgba(235,228,211,.15);padding-top:12px}
summary{cursor:pointer;font-family:"Song Myung","Gowun Batang",serif;font-size:21px;list-style:none;min-height:44px;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:rotate(45deg);margin-left:4px;transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
dl.gl{margin:8px 0 0}
dl.gl dt{font-size:16.5px;margin-top:12px}
dl.gl dd{margin:2px 0 0;font-size:14.5px;color:#cfc8b6;line-height:1.7;word-break:keep-all}
.danger{border-color:rgba(228,107,91,.6)!important}
.title-screen{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(70% 60% at 50% 52%,rgba(6,8,19,.25),rgba(6,8,19,.78));transition:opacity .9s}
.title-screen.out{opacity:0;pointer-events:none}
.title-screen .in{max-width:28em;display:flex;flex-direction:column;align-items:center}
.title-screen h1{font-family:"Song Myung","Gowun Batang",serif;font-weight:400;font-size:clamp(46px,13vw,80px);line-height:1.04;letter-spacing:-.02em;margin:0}
.title-screen .st{margin:14px 0 0;font-size:16px;color:var(--dim)}
.title-screen .by{margin:6px 0 0;font-family:"Song Myung","Gowun Batang",serif;font-size:17px;color:#cdbf9f;letter-spacing:.04em}
.og .title-screen .acts,.og .title-screen .note,.og .top,.og .bottom{display:none!important}
.og .title-screen h1{font-size:76px}
.title-screen .epi{margin:26px 0 30px;font-size:16.5px;line-height:1.85;word-break:keep-all}
.title-screen .epi span{display:block}
.title-screen .epi .gap{height:.7em}
.title-screen .acts{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.title-screen .note{margin:18px 0 0;font-size:13px;line-height:1.65;color:#8f8a7c;word-break:keep-all}
.stitchline{display:block;width:120px;margin:22px auto 0;border-top:1.5px dashed rgba(220,207,176,.55)}
/* ---- listening: device voice reads the ledger aloud ---- */
.ctarow{display:flex;align-items:center;gap:8px}
.ctarow .ib.lis{width:48px;height:48px;border:1.5px dashed rgba(220,207,176,.6);background:rgba(14,20,46,.88)}
.rh .lisbtn{margin:16px 0 0;min-height:42px;padding:8px 18px;font-size:15px}
.title-screen .acts .sbtn svg{width:19px;height:19px}
.player{position:fixed;z-index:12;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);width:min(520px,calc(100% - 16px));padding:7px 10px 8px;border-radius:20px;background:rgba(9,13,32,.95);border:1px dashed rgba(220,207,176,.45);box-shadow:0 12px 40px rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:plin .35s ease-out}
@keyframes plin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.pl-info{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 8px 3px;font-size:13px;color:var(--dim)}
.pl-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9d1bf}
.pl-p{flex:none;font-variant-numeric:tabular-nums}
.pl-btns{display:flex;justify-content:space-between;align-items:center;gap:2px}
.pb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;padding:0;color:var(--cotton);flex:none}
.pb svg{width:22px;height:22px}
.pb.big{width:54px;height:54px;background:var(--cotton);color:#0c1028}
.pb.big svg{width:25px;height:25px}
.pb.txt{font-size:14.5px;font-variant-numeric:tabular-nums;color:#e0d8c5}
.pb:hover{background:rgba(255,255,255,.06)}
.pb.big:hover{background:#fff6e4}
.pb:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
.listening .bottom{display:none}
.listening .reader .sheet,.listening .panel .sheet{padding-bottom:calc(170px + var(--safe-b))}
.listening .card{bottom:calc(112px + var(--safe-b));max-height:min(40vh,400px)}
.subtitle{position:fixed;z-index:6;left:50%;bottom:calc(112px + var(--safe-b));transform:translateX(-50%);width:min(34em,calc(100% - 24px));margin:0;padding:14px 18px;text-align:center;font-size:calc(17px * var(--fs));line-height:1.8;color:#f1eadb;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 14px rgba(4,6,14,.9);background:radial-gradient(closest-side,rgba(4,6,14,.55),rgba(4,6,14,0));word-break:keep-all;pointer-events:none}
.subtitle.in{animation:subin .8s ease-out}
@keyframes subin{from{opacity:0;transform:translate(-50%,5px)}to{opacity:1;transform:translate(-50%,0)}}
.card:not([hidden])~.subtitle{display:none}
.rb [data-pi]{transition:background-color .7s,box-shadow .7s;border-radius:5px}
.rb .speaking{background-color:rgba(207,213,244,.085);box-shadow:0 0 0 .4em rgba(207,213,244,.085)}
.rh h1{transition:text-shadow .8s,color .8s}
.rh h1.speaking{color:#fffaf0;text-shadow:0 0 22px rgba(207,213,244,.55),0 0 2px rgba(255,250,240,.6)}
.listening .rb [data-pi]{cursor:pointer}
.dawnfx{position:fixed;inset:0;z-index:11;pointer-events:none;overflow:hidden}
.dawnfx.dawn{background:radial-gradient(130% 75% at 50% 108%,rgba(207,213,244,.22),rgba(214,190,214,.08) 45%,rgba(7,10,22,0) 72%);animation:dawnr 4.6s ease-in-out forwards}
@keyframes dawnr{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.dawnfx .streak{position:absolute;display:none;top:15%;left:66%;width:150px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,250,235,0),rgba(255,250,235,.95));transform-origin:100% 50%;transform:rotate(152deg)}
.dawnfx.fall .streak{display:block;animation:streak 1.4s ease-in forwards}
@keyframes streak{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-130px 80px}}
.vset{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.vset .lead{margin:0}
.vset label{display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:#d9d1bf}
.vset label b{font-weight:400;color:var(--cotton);margin-left:6px}
.vrow{display:flex;align-items:flex-end;gap:8px}
.vrow label{flex:1}
.vset select{width:100%;min-height:44px;padding:8px 10px;font:15px "Gowun Batang",serif;color:var(--cotton);background:rgba(6,9,22,.85);border:1px solid rgba(235,228,211,.3);border-radius:10px}
.vset select:focus-visible,.vset input:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}
.vset input[type=range]{width:100%;accent-color:#dccfb0;min-height:32px}
.vset .chk{flex-direction:row;align-items:center;gap:10px;min-height:36px}
.vset .chk input{width:20px;height:20px;accent-color:#dccfb0;flex:none}
.vrow .sbtn{min-height:44px;padding:8px 14px;font-size:14px;white-space:nowrap}
.vset .acts{display:flex;flex-wrap:wrap;gap:8px}
[hidden]{display:none!important}
@media (min-width:900px){.brand .bt{font-size:23px}.sheet{padding-top:calc(84px + var(--safe-t))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
