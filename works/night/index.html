:[[2,3],[3,4],[4,5],[5,0],[0,1]],"flags":{"moonroad":1}},{"n":27,"col":"#fff1d6","stars":[[28.0,40.996,2.6,{}],[26.484,37.69,2.5,{}],[28.979,35.297,2.3,{}],[28.0,32.513,1.6,{}]],"edges":[[0,1],[1,2],[2,3]],"flags":{}},{"n":28,"col":"#f6f8ff","stars":[[0.0,90.0,1.0,{"fixed":1}]],"edges":[],"flags":{}},{"n":29,"col":"#ffcf8e","stars":[[146.294,43.223,3.6,{"col":"#ffd9a8"}]],"edges":[],"flags":{"epilogue":true}}],"minor":[["딸꾹질","사흘 동안 딸꾹질을 한 아이가 그것만 멎기를 바랐다. 나흘째 아침 구멍은 저절로 메워졌다. 그래도 적어 둔다. 아이에게 사흘은 길었다."],["첫눈","눈이 오지 않는 남쪽 섬의 아이가 첫눈을 기다렸다. 일흔 해를 기다렸다. 여든에 뭍으로 나와 처음 눈을 맞았다. 그날 별이 조금 하얘졌다."],["장기 한 수","장기에서 진 노인이 한 수만 물러 달라고 밤새 빌었다. 이튿날 친구가 물러 주었다. 노인은 또 졌다."],["제비 처마","해마다 제비가 깃들던 처마가 있었다. 제비가 오지 않은 봄, 처마가 구멍을 냈다. 집이 그리워하는 일도 있다."],["병 속 편지","섬 아이가 병에 편지를 넣어 바다에 띄울 때마다 하나씩. 지금까지 스물셋. 답장은 아직이다."],["부치지 않은 편지","마흔 해 동안 품에 지닌 편지. 한 번도 부치지 않았다. 받을 사람도 같은 편지를 품고 있다는 걸 나는 안다. 둘 다 모른다."],["어미 소","팔려 간 송아지를 부르는 어미 소. 사흘 밤을 울었다. 별 셋이 한 줄로 났다."],["누룽지","변방에 수자리 간 아들이 어머니의 누룽지를 그리워했다. 돌아온 날, 솥 바닥 긁는 소리를 듣고 울었다."],["대장간","대장장이가 아버지의 망치 장단을 그리워했다. 제 망치로 그 장단을 찾는 데 스무 해가 걸렸다."],["다리","강 건너 처녀를 좋아한 총각이 다리를 바랐다. 다리를 놓은 건 그의 손자였다. 그 별은 다리 모양이 아니다. 그냥 둥글다."],["피리","잃어버린 피리 소리를 찾는 귀. 장터마다 피리 부는 사람 앞에 한참씩 섰다."],["거울","젊은 날의 얼굴을 그리워한 여인. 들여다보니 그 아침 거울 속에는 지금 얼굴이 웃고 있었다. 그리움이 저보다 먼저 알았다."],["장날","마당 개가 장에 간 주인을 기다렸다. 하루짜리 구멍이라 저녁이면 메워진다. 장날마다 열렸다 닫힌다."],["젖니","이가 빠진 아이가 지붕에 이를 던지고 새 이를 바랐다. 까치가 물어 갔다. 새 이는 났다."],["담뱃대","할아버지 담배 냄새를 그리워한 손녀. 살아 계실 땐 그 냄새를 그렇게 싫어했다."],["메뚜기","소나기 한 줄기를 바란 메뚜기 떼. 별이 너무 작아 돋보기로 겨우 찾았다."],["뱃노래","노 젓는 장단에 맞춰 부르던 노래를 그리워한 늙은 사공. 이제 배에는 돛이 달렸다."],["까치밥","겨울 까치가 감나무 꼭대기의 마지막 감을 바랐다. 주인이 따지 않고 남겨 두었다. 구멍은 그날로 메워졌다."],["이름","제 이름을 불러 주던 사람이 다 죽은 노파. 누가 한 번만 이름을 불러 주기를. 이웃 아이가 불렀다. 할매, 가 아니라 이름을."],["꽃신","맨발로 자란 아이가 꽃신을 바랐다. 열여섯에 신었다. 아까워서 손에 들고 걸었다."],["굴뚝 연기","저녁마다 이웃집 굴뚝 연기를 바라보는 홀아비. 연기가 오르면 거기 누가 산다는 뜻이니까."],["등대","등대지기가 하룻밤만 불을 끄고 자고 싶었다. 서른 해 동안 한 번도 못 했다. 그리움이 꼭 거창한 것만은 아니다."],["겨울잠","잠 못 드는 곰. 늦가을 내내 뒤척였다. 동짓날에야 잠들었다."],["물레방아","물이 마른 물레방아가 다시 돌기를 바랐다. 물레방아의 그리움에는 삐걱 소리가 난다."],["돌탑","돌 하나 얹고 비는 사람들. 탑이 높아질수록 별이 하나씩. 별들은 탑처럼 쌓이지 않고 흩어져 있다. 바라는 게 다 달라서."],["북채","북채를 놓은 늙은 고수. 손이 떨려 이제 못 친다. 밤마다 무릎을 두드린다."],["엿장수","엿장수 가위 소리만 들리면 뛰어나가던 아이. 지금은 엿장수다."],["등 긁기","등 한가운데 손이 안 닿는 데가 가려운 홀아비. 이것도 그리움이다. 웃지 마라."],["매미","일곱 해를 땅속에서 산 매미가 하늘을 그리워했다. 나와서 이레를 울었다. 별은 매미보다 오래 간다."],["열쇠","잃어버린 열쇠를 찾는 사람. 무엇을 여는 열쇠였는지는 잊었다. 그래도 찾는다."],["첫 품삯","품삯을 처음 받은 머슴이 어머니께 꽃신을 사 드리고 싶었다. 어머니 발 크기를 몰라 세 켤레를 샀다."],["빈 그네","그네 타던 딸이 시집갔다. 아버지가 빈 그네를 민다."],["돌아오는 배","포구 아낙들이 한꺼번에 낸 구멍들. 고깃배가 돌아오는 날이면 별들이 한꺼번에 깜박인다."],["바람개비","바람을 기다린 바람개비. 아이가 대신 뛰었다."],["먼저 온 사과","형에게 사과하러 가던 동생. 형이 먼저 와 있었다. 같은 말을 하려고. 구멍 둘이 겹쳐 하나가 되었다."],["한나절 잠","아이 셋 키우는 어미의 소원은 한나절 잠. 구멍은 작은데 깊다."],["기와 한 장","비 새는 지붕 아래 사는 식구들이 기와 한 장을 바랐다. 한 장이면 됐다."],["맷돌","혼자 맷돌을 돌리던 과부가 손잡이 맞은편에 앉을 사람을 그리워했다."],["물질","산골로 시집온 해녀. 물에 들고 싶은 밤마다 하나씩. 그 별은 축축하다."],["귀지","무릎에 눕혀 귀지를 파 주던 할머니를 그리워한 손자. 손자가 할아버지가 되어 손주 귀를 판다."],["마지막 잎","겨울 내내 가지 끝에 붙어 있던 잎 하나가 봄을 그리워했다. 새잎이 돋던 날 떨어졌다."],["닷새장","닷새마다 서는 장을 기다리는 늙은 떡장수. 장 없는 나흘이 길다."],["아기 울음","아이를 기다린 부부. 열두 해. 별이 열둘이다. 열셋째 해에 울음소리가 났다. 별은 늘지 않고 밝아졌다."],["첫서리","첫서리 전에 김장을 마치고 싶은 할머니. 해마다 구멍이 난다. 해마다 메워진다."],["건져 준 손","물에 빠진 자기를 건져 준 사람의 얼굴을 알고 싶은 사내. 얼굴은 못 봤다. 손만 기억한다."],["노을","노을을 좋아한 아이. 저녁마다 지붕에 올라갔다. 그 별은 노을빛이다."],["낮달","낮에 뜬 달을 처음 본 아이가 밤까지 기다렸다. 달이 왜 낮에도 뜨는지는 나도 모른다. 아마 아침이 못 참은 것이다."],["고향 우물","도성에서 물장수 하는 사내가 고향 우물 물맛을 그리워했다. 남의 물을 지고 날마다 걷는다."],["귀뚜라미","귀뚜라미 소리를 기다리는 늙은 선비. 그 소리가 나야 가을인 줄 안다."],["반쪽 노리개","노리개를 반으로 쪼개 나눠 가진 오누이. 난리 통에 흩어졌다. 반쪽 별 둘이 하늘 양 끝에 있다."],["군불","겨울밤 군불을 때 주던 남편을 그리워한 아내. 이제 아들이 땐다. 불 때는 소리가 같다."],["웃음","웃는 법을 잊은 사내가 웃음을 그리워했다. 손주가 그의 수염을 잡아당겼다. 웃었다."],["별 세는 아이","하늘의 별을 다 세고 싶은 아이. 밤마다 세다 잠들었다. 아이가 센 별 가운데 하나는 아이가 낸 것이다. 아이는 모른다."],["박","지붕 위 박이 익기를 기다린 가난한 집. 박 속에 쌀이 들었기를 바랐다. 들어 있지 않았다. 대신 바가지가 둘 생겼다."],["엄마 저고리","엄마가 장에 간 사이 엄마 저고리를 덮고 잔 아이. 저녁에 메워진 구멍."],["담 너머","스무 해 말 안 한 이웃 둘이 같은 날 같은 담 너머를 보았다. 이듬해 그 담이 낮아졌다."],["숨바꼭질","숨바꼭질하다 아무도 찾으러 오지 않은 아이. 해가 지도록 숨어 있었다. 그 별도 아주 잘 숨어 있다. 나도 찾는 데 한참 걸렸다."],["귀양지의 답장","귀양 간 선비가 아내의 답장을 기다렸다. 답장은 그가 죽은 뒤 도착했다. 아내는 그걸 알고도 해마다 편지를 썼다."],["꽃씨","남의 집 담 너머 꽃을 좋아한 아이가 꽃씨를 바랐다. 주인 할머니가 가을에 한 줌 쥐여 주었다."],["비석","이름 없는 무덤에 이름을 새겨 주고 싶었던 석수. 품삯 줄 사람이 없었다. 밤에 몰래 새겼다."],["징검돌","개울 건너 서당에 가고 싶은 아이. 징검돌이 하나 모자랐다. 아버지가 큰 돌 하나를 지고 왔다."],["첫걸음","걷지 못하던 아이가 걷고 싶었다. 일곱 해. 한 걸음. 그 별은 작지만 내가 아는 가장 단단한 구멍이다."],["다음 생","다음 생에 만나자고 약속한 부부. 다음 생이 있는지 나는 모른다. 구멍 둘은 한자리에 났다."],["풍경","산사 처마의 풍경이 바람을 그리워했다. 바람 없는 한여름 낮. 물고기 모양 쇠붙이도 그리워한다."],["줄광대","줄에서 떨어진 줄광대가 다시 줄에 오르고 싶었다. 다리가 낫는 데 두 해. 셋째 해에 올랐다."],["지게","평생 지게를 진 노인이 지게 없이 걷는 꿈을 꾸었다. 막상 내려놓으니 허리가 굽어 있었다. 그래도 걸었다."],["찬물","염전에서 일하는 사내의 그리움은 찬물 한 그릇. 그 별에는 물기가 맺힌다."],["동생","동생을 바란 외동아이. 동생이 생기자 형 노릇이 싫었다. 별은 그대로 있다. 원래 그런 거다."],["장승","마을 어귀 장승이 길 건너 마주 선 장승을 그리워했다. 백 년 동안 마주 보고 섰다. 닿지 않는다."],["보릿고개","보릿고개를 넘는 마을의 그리움. 보리 이삭이 패기를. 해마다 난다. 해마다 넘는다."],["그림자","그림자와 노는 아이. 흐린 날이면 그림자가 없어서 그리워했다."],["저녁 종","절을 떠난 스님이 저녁 종소리를 그리워했다. 해 질 무렵이면 귀를 기울인다. 그 마을에는 종이 없다."],["무지개","무지개 끝을 찾아 걷던 아이. 해가 져서 돌아왔다. 다음 날 또 갔다."],["손톱달","손톱을 깎다가 손톱 조각이 달 같다고 한 아이. 그 밤 정말 손톱 같은 달이 떴다. 아침이 그 아이를 보고 있었을지도 모른다."],["흰머리","어머니 흰머리를 뽑아 드리던 딸. 이제 제 흰머리를 뽑아 줄 딸이 없다. 거울 앞에서 혼자 뽑는다."],["늙은 개의 꿈","늙은 개가 젊은 날의 들판을 꿈꾼다. 자면서 발을 구른다. 그 별도 밤마다 조금씩 움찔한다."],["훈장님 낮잠","서당 아이들이 훈장님 낮잠을 바랐다. 그래야 놀 수 있으니까. 훈장님은 날마다 낮잠을 잤다. 구멍은 날마다 열렸다 닫힌다."],["빈자리","마루 끝 할아버지 자리. 아무도 앉지 않는다. 자리가 그리워하는지 식구들이 그리워하는지 모르겠다. 아마 둘 다."],["장 단지","바다 건너 시집간 딸이 친정 장맛을 그리워했다. 해마다 친정에서 장 단지가 배를 탔다."],["손바닥 글씨","귀가 먼 할아버지가 손녀 목소리를 그리워했다. 손녀가 할아버지 손바닥에 글씨를 써 드렸다. 그 별은 소리 없이 깜박인다."],["잉어","가뭄에 마른 연못의 잉어가 비를 바랐다. 비 오는 날 개구리가 먼저 울었다."],["하루","하루만 더 살고 싶었던 노인. 하루를 더 살았다. 그 하루에 손자 혼례를 보았다."],["붓","글을 배우고 싶었던 종이 밤마다 땅바닥에 손가락으로 글씨를 썼다. 주인집 도련님이 몰래 붓을 주었다. 둘은 평생 동무로 지냈다."],["산 너머","산 너머에 뭐가 있는지 궁금한 아이. 넘어 보니 또 산이었다. 그 너머도 산이었다. 아이는 지금 소금장수 달래를 따라다닌다."],["코 고는 소리","남편 코 고는 소리가 지겨웠던 아내. 남편이 먼 데 장사 간 밤, 그 소리가 그리워 잠을 못 잤다."],["해바라기","흐린 날 해바라기는 어디를 보는가. 해가 있던 자리를. 그 구멍은 노랗다."],["눈사람","봄이 오지 않기를 바란 아이. 눈사람이 녹을까 봐. 봄은 왔다. 아이는 이듬해 겨울을 기다렸다. 그리움은 방향을 바꾼다."],["반딧불","반딧불을 병에 담은 아이가 날이 새자 놓아주었다. 아이가 바란 건 반딧불이 계속 빛나는 것, 반딧불이 바란 건 풀숲. 둘 다 이루어졌다."],["읽어 준 편지","글 모르는 어머니가 아들의 편지를 훈장에게 읽어 달라 했다. 서른 번을 청했다. 훈장은 서른 번 읽었다."],["발소리","밤늦게 돌아오는 딸의 발소리를 기다리는 아비. 골목 끝에서부터 안다. 딸은 모른다."],["잔치국수","잔칫날 국수를 그리워한 거지가 잔칫집 문 앞에 섰다. 문이 열렸다."],["배웅","나룻배로 시집가는 언니를 배웅한 동생. 해마다 그날이면 강가에 섰다. 강 건너 같은 자리에 언니가 섰다."],["나비","번데기 속 나비가 날개를 그리워했다. 그 별은 아주 얇다. 바람에 흔들린다."],["돌다리","백 년 된 돌다리가 무너지기 싫었다. 마을 사람들이 해마다 돌을 갈아 끼웠다. 이제 처음 돌은 하나도 없다. 그래도 같은 다리다."],["새벽 종","새벽 종을 치는 어린 사미가 한 번만 늦잠을 자고 싶었다. 마흔 해 뒤 주지가 되어, 어린 사미에게 늦잠을 허락했다."],["손금","손금을 보던 늙은 점쟁이가 제 손금이 틀렸기를 바랐다. 틀렸다. 그는 일흔을 넘겼다."],["마지막 손님","문 닫기 직전 주막에 든 손님. 주모는 그를 기다린 것 같았다. 그도 그 국밥을 기다린 것 같았다."],["처음","어디서 왔는지 기억이 없는 아이. 그래도 무언가를 그리워한다. 나는 그 별을 오래 들여다보았다. 바다 냄새가 났다."],["다듬이","다듬이 소리를 그리워한 과부. 혼자 두드리면 장단이 맞지 않는다. 둘이 두드려야 소리가 된다."],["산딸기","산딸기 철을 기다린 아이들. 별이 빨갛다. 오래가지는 않는다."],["짚신","짚신 삼는 노인이 맨발로 뛰는 손자를 걱정했다. 해마다 한 치씩 크게 삼았다."],["겨울 새벽","새벽에 물 길으러 나가는 며느리가 한 번만 따뜻한 물로 세수하고 싶었다. 이튿날 아궁이 위에 데운 물이 있었다. 시어머니는 아무 말도 하지 않았다."],["반딧불 공부","글 읽는 아이가 등잔 기름이 떨어지지 않기를 바랐다. 반딧불을 모았다. 글씨가 잘 안 보였다. 그래도 읽었다."],["장마","장마철 솥뚜껑에 맺힌 물방울을 세던 아이가 해를 바랐다. 이레째 해가 났다. 이번엔 물방울을 그리워했다."],["자장가","자장가를 하나도 기억 못 하는 어미가 제 어미의 자장가를 그리워했다. 아기를 안고 아무렇게나 흥얼거렸다. 그게 그 집 자장가가 되었다."],["낯익은 손","이름 없는 별 하나. 들여다보니 어느 탑 위에서 바늘을 든 젊은이가 보였다. 얼굴은 흐린데 손이 낯익다. 수선공이 되고 싶은 누군가의 별인 듯하다. 아직 오지 않은."],["할미의 실","덕이 할미가 내려간 첫해, 할미가 쓰던 실을 차마 다 쓰지 못한 나. 이건 내 별이다. 작다."],["잔별","잔별을 다 적지 못한다. 기록하지 못한 것이 기록한 것보다 언제나 많다. 이름 없는 별들아, 미안하다."]],"gloss":[["감침질","천의 가장자리를 실로 감아 올이 풀리지 않게 하는 바느질. 수선공의 진짜 일."],["시침질","본바느질 전에 성기게 임시로 꿰어 두는 바느질. 같은 이야기의 별들을 흩어지지 않게 이어 둔 선이 시침실이다."],["골무","바늘을 밀 때 손가락 끝에 끼는 덮개. 가죽이나 쇠로 만든다."],["실패","실을 감아 두는 작은 나무 도구. 그리고, 일이 뜻대로 되지 않음. 덕이 할미의 말장난."],["바늘귀","바늘 끝에 뚫린, 실을 꿰는 구멍."],["날실과 씨실","천을 짤 때 세로로 걸어 두는 실과 가로로 엮어 넣는 실."],["북 · 바디 · 잉아","베틀의 부속. 북은 씨실을 날라 오가고, 바디는 씨실을 쳐서 다지고, 잉아는 날실을 번갈아 들어 올린다."],["무명","목화솜에서 자은 실로 짠 천. 이름이 없다는 무명(無名)과 소리가 같다."],["쪽빛","쪽이라는 풀로 물들인 짙은 남빛. 하늘 천의 빛깔."],["볕뉘","작은 틈으로 잠깐 들어오는 햇볕. 운곡사 고양이의 이름."],["윤슬","햇빛이나 달빛에 비치어 반짝이는 잔물결."],["미리내","은하수를 이르는 우리말. 이 이야기에서는 큰물의 해에 찢어진 하늘을 건너 짠 자리."],["붙박이별","북극성을 이르는 우리말. 한자리에 붙박여 움직이지 않는 별. 이 이야기에서는 밤이 처음으로 아침을 본 자리."],["삭","달이 보이지 않는 날, 음력 초하루. 별이 가장 밝다."],["초승","음력 초사흘 무렵 저녁 서쪽 하늘에 뜨는 가는 달."],["상현","음력 초여드레 무렵의 반달. 오른쪽이 차 있다."],["보름","음력 열닷새의 둥근 달. 수선공이 쉬는 밤."],["하현","음력 스무사흘 무렵의 반달. 자정 넘어 뜬다."],["그믐","음력 달의 마지막 날. 새벽녘에 손톱 같은 달이 잠깐 뜬다."],["통사","통역하는 사람을 이르던 옛말."],["수의","죽은 이에게 입히는 옷."],["수자리","변방을 지키던 일, 또는 그 병졸."],["대롱","가는 통. 비둘기 발목에 매어 편지를 넣는다."],["덧문","창이나 문 바깥에 덧다는 문. 수선공은 낮에 이것을 닫고 잔다."]]}</script>
<script>
{
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const D2R = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function gauss(R) { let u = 0; while (u === 0) u = R(); const v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function unitRD(ra, dec) { const a = ra * D2R, d = dec * D2R, c = Math.cos(d); return [c * Math.cos(a), c * Math.sin(a), Math.sin(d)]; }
function norm(v) { const n = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / n, v[1] / n, v[2] / n]; }
function toRD(v) { v = norm(v); return [((Math.atan2(v[1], v[0]) / D2R) + 360) % 360, Math.asin(clamp(v[2], -1, 1)) / D2R]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function angSep(a, b) { return Math.acos(clamp(dot(a, b), -1, 1)); }
function slerp(a, b, t) {
  const w = angSep(a, b);
  if (w < 1e-7) return a.slice();
  const s = Math.sin(w), p = Math.sin((1 - t) * w) / s, q = Math.sin(t * w) / s;
  return [p * a[0] + q * b[0], p * a[1] + q * b[1], p * a[2] + q * b[2]];
}
function galToEq(l, b) {
  const L = l * D2R, B = b * D2R, gx = Math.cos(B) * Math.cos(L), gy = Math.cos(B) * Math.sin(L), gz = Math.sin(B);
  return [
    -0.0548755604 * gx + 0.4941094279 * gy - 0.867666149 * gz,
    -0.8734370902 * gx - 0.44482963 * gy - 0.1980763734 * gz,
    -0.4838350155 * gx + 0.7469822445 * gy + 0.4559837762 * gz
  ];
}
function eclToEq(lam, beta) {
  const e = 23.4393 * D2R, L = lam * D2R, B = beta * D2R;
  const x = Math.cos(B) * Math.cos(L), y = Math.cos(B) * Math.sin(L), z = Math.sin(B);
  return [x, y * Math.cos(e) - z * Math.sin(e), y * Math.sin(e) + z * Math.cos(e)];
}
function hexRGB(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function hexA(hex, a) { const c = hexRGB(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mixHex(h1, h2, t) { const a = hexRGB(h1), b = hexRGB(h2); return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hasBatchim(w) { const c = w.charCodeAt(w.length - 1); if (c < 0xac00 || c > 0xd7a3) return false; return (c - 0xac00) % 28 !== 0; }
const josa = (w, a, b) => w + (hasBatchim(w) ? a : b);

/* ---------- chapters & constellations ---------- */
const CH = DATA.chapters.slice().sort((a, b) => a.night - b.night);
const NUMK = ['', '첫째', '둘째', '셋째', '넷째', '다섯째', '여섯째', '일곱째', '여덟째', '아홉째', '열째', '열한째', '열두째', '열셋째', '열넷째', '열다섯째', '열여섯째', '열일곱째', '열여덟째', '열아홉째', '스무째', '스물한째', '스물두째', '스물셋째', '스물넷째', '스물다섯째', '스물여섯째', '스물일곱째', '스물여덟째'];
const label = n => (n === 0 ? '서(序)' : n === 29 ? '맺음' : `제${n}밤`);
const cname = n => (n === 1 ? '사공자리' : n === 29 ? '결의 첫 별' : CH[n].title);
const CONS = {};
for (const c of DATA.cons) {
  const ch = CH[c.n];
  const stars = c.stars.map((s, i) => ({ v: unitRD(s[0], s[1]), mag: s[2], ex: s[3] || {}, ins: (ch && ch.stars[i]) || '', i, n: c.n }));
  let cx = 0, cy = 0, cz = 0;
  for (const s of stars) { cx += s.v[0]; cy += s.v[1]; cz += s.v[2]; }
  const center = norm([cx, cy, cz]);
  let size = 0;
  for (const s of stars) size = Math.max(size, angSep(center, s.v));
  CONS[c.n] = { n: c.n, col: c.col, stars, edges: c.edges, flags: c.flags || {}, center, size: size / D2R };
}
// wide constellations get a focus star instead of the centroid
CONS[24].focus = CONS[24].stars[6].v; CONS[24].fovT = 118;
CONS[26].focus = CONS[26].stars[2].v; CONS[26].fovT = 118;
const headOf = n => { const ch = CH[n]; for (const s of ch.sections) for (const b of s.blocks) if (b.k === 'head') return b.t; return ''; };

/* ---------- moon ---------- */

/* ---------- picking ---------- */
function pick(px, py) {
  let best = null, bd = 30;
  const take = (kind, obj, v) => {
    if (!proj(v) || P[3] < -0.02) return;
    const d = Math.hypot(P[0] - px, P[1] - py);
    if (d < bd) { bd = d; best = { kind, obj }; }
  };
  for (const c of Object.values(CONS)) { if (!conVisible(c)) continue; for (const s of c.stars) take('con', s, s.v); }
  for (const m of MINOR) take('minor', m, m.v);
  S.mine.forEach((m, i) => take('mine', { i }, unitRD(m[0], m[1])));
  if (moonInfo.E && proj(moonInfo.mv)) { const R = 2.0 * D2R * F * P[2] + 10; if (Math.hypot(P[0] - px, P[1] - py) < Math.max(R, 26) && !best) best = { kind: 'moon', obj: {} }; }
  return best;
}
function onTap(x, y) {
  hideHint();
  if (PLACE) { makeStar(x, y); return; }
  const h = pick(x, y);
  if (!h) { hideCard(); return; }
  if (h.kind === 'con') conCard(h.obj);
  else if (h.kind === 'minor') minorCard(h.obj);
  else if (h.kind === 'mine') mineCard(h.obj.i);
  else if (h.kind === 'moon') moonCard();
}

/* ---------- chapter plates: the constellation drawn as a ledger figure ---------- */
function plateSVG(n) {
  const c = CONS[n];
  if (!c) return '';
  let pts;
  if (c.flags.milky) {
    pts = c.stars.map((s, i) => [i * 10, Math.sin(i * 0.9) * 6]);
  } else if (c.flags.moonroad) {
    const k = [2, 7, 14, 21, 28, 18];
    const W2 = 300, step = W2 / 6;
    return `<svg class="plate" viewBox="0 0 ${W2} 64" aria-hidden="true">${k.map((nn, i) => `<g transform="translate(${step * i + step / 2},32)">${moonPath(nn, 12)}</g>`).join('')}<path d="M${step / 2 + 14},32 H${W2 - step / 2 - 14}" stroke="#dccfb0" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/></svg>`;
  } else {
    const ctr = c.center, east = norm([-ctr[1], ctr[0], 0]);
    const north = norm([-ctr[2] * ctr[0], -ctr[2] * ctr[1], 1 - ctr[2] * ctr[2]]);
    const flip = toRD(CONS[n === 29 ? 21 : n].center)[1] >= 37 ? -1 : 1;
    pts = c.stars.map(s => { const d = dot(s.v, ctr); return [(-dot(s.v, east) / d) * flip, (dot(s.v, north) / d) * flip]; });
  }
  if (n === 29) pts = CONS[21].stars.map(s => s.v).concat([CONS[29].stars[0].v]).map(v => { const ctr = CONS[21].center, east = norm([-ctr[1], ctr[0], 0]), north = norm([-ctr[2] * ctr[0], -ctr[2] * ctr[1], 1 - ctr[2] * ctr[2]]); const d = dot(v, ctr); return [dot(v, east) / d, -dot(v, north) / d]; });
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const BW = 300, BH = 120, pad = 14;
  const sc = Math.min((BW - 2 * pad) / Math.max(1e-6, x1 - x0), (BH - 2 * pad) / Math.max(1e-6, y1 - y0), 2300);
  const ox = BW / 2 - ((x0 + x1) / 2) * sc, oy = BH / 2 + ((y0 + y1) / 2) * sc;
  const P2 = pts.map(([x, y]) => [ox + x * sc, oy - y * sc]);
  const stars = n === 29 ? CONS[21].stars.concat(CONS[29].stars) : c.stars;
  const edges = n === 29 ? CONS[21].edges : c.edges;
  let h = `<svg class="plate" viewBox="0 0 ${BW} ${BH}" aria-hidden="true">`;
  if (c.flags.nebula) h += `<circle cx="${P2[2][0]}" cy="${P2[2][1]}" r="34" fill="url(#pg)"/><defs><radialGradient id="pg"><stop offset="0" stop-color="#e7b6cf" stop-opacity=".55"/><stop offset="1" stop-color="#e7b6cf" stop-opacity="0"/></radialGradient></defs>`;
  for (const [i, j] of edges) {
    const a = P2[i], b = P2[j], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, g = 7;
    if (L < 2 * g + 2) continue;
    h += `<line x1="${(a[0] + dx / L * g).toFixed(1)}" y1="${(a[1] + dy / L * g).toFixed(1)}" x2="${(b[0] - dx / L * g).toFixed(1)}" y2="${(b[1] - dy / L * g).toFixed(1)}" stroke="#dccfb0" stroke-width="1.1" stroke-dasharray="4 4" opacity=".7"/>`;
  }
  stars.forEach((s, i) => {
    const [x, y] = P2[i];
    if (s.ex.closed) { h += `<circle cx="${x}" cy="${y}" r="4.2" fill="#03040a" stroke="#dccfb0" stroke-width=".8" stroke-dasharray="1.4 1.6"/>`; return; }
    const r = clamp(3.4 - s.mag * 0.55, 1.3, 4.4) + (n === 29 && i === stars.length - 1 ? 0.6 : 0);
    const col = s.ex.col || (n === 29 && i === stars.length - 1 ? '#ffd9a8' : (CONS[s.n] || c).col);
    h += `<circle cx="${x}" cy="${y}" r="${(r * 2.6).toFixed(1)}" fill="${col}" opacity=".12"/><circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${col}"/>`;
    if (n === 28) for (let q = 1; q <= 5; q++) h += `<circle cx="${x}" cy="${y}" r="${6 + q * 3.2}" fill="none" stroke="#dccfb0" stroke-width=".7" stroke-dasharray="1.2 2" opacity="${(0.55 - q * 0.08).toFixed(2)}"/>`;
  });
  return h + '</svg>';
}

    if (b.k === 'head') return `<p class="lh" data-pi="${U('head', role, b.t)}">${esc(b.t)}</p>`;

    if (k === 'vamb') { if (NV.on && S.vamb && !S.sound && auResume()) { S.sound = true; save(); updateChrome(); setAmbient(true); } }
    else if (k !== 'vcont') vRestartHere();
  });
  document.addEventListener('input', e => {
    const t = e.target.closest('[data-vs="vrate"]');
    if (t) { const o = $('#vrateV'); if (o) o.textContent = `${(+t.value).toFixed(2)}×`; }
  });
  voiceDetect();
})();

/* ================= loop & boot ================= */
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, DPRMAX);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  glow.width = Math.max(1, Math.round(W / 3)); glow.height = Math.max(1, Math.round(H / 3));
  glowKey = '';
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) vWake();
  if (!AU.ctx) return;
  try { if (document.hidden) { if (!keepAudio()) AU.ctx.suspend(); } else if (S.sound) AU.ctx.resume(); } catch (e) { /* ignore */ }
});

let lastT = performance.now(), slowFrames = 0, nextMeteor = 9 + Math.random() * 10;
function update(dt) {
  if (FX.fly) {
    const f = FX.fly, p = clamp((T - f.t0) / f.dur, 0, 1), e = easeIO(p);
    V.th = (f.a.th + f.d.th * e + 360) % 360;
    V.yaw = (f.a.yaw + f.d.yaw * e + 360) % 360;
    V.pitch = f.a.pitch + f.d.pitch * e;
    V.fov = f.a.fov + f.d.fov * e;
    if (p >= 1) { const done = f.done; FX.fly = null; if (done) done(); }
  } else {
    if (!REDUCED) V.th = (V.th + dt * 0.12) % 360;
    if (!drag && (Math.abs(FX.vel.y) > 0.02 || Math.abs(FX.vel.p) > 0.02)) {
      V.yaw = (V.yaw + FX.vel.y * dt + 360) % 360;
      V.pitch = clamp(V.pitch + FX.vel.p * dt, -6, 88);
      const k = Math.exp(-dt * 3.4); FX.vel.y *= k; FX.vel.p *= k;
    }
  }
  if (FX.stitch) {
    const s = FX.stitch, c = CONS[s.n], done = Math.floor((T - s.t0) / s.per);
    while (s.notes < Math.min(done, c.edges.length)) { stitchNote(s.notes); s.notes++; }
    if ((T - s.t0) / s.per >= c.edges.length + 0.25) { FX.stitch = null; afterStitch(s.n); }
  }
  if (FX.dawnT && T > FX.dawnT) { FX.dawnA = T; FX.dawnT = 0; }
  if (FX.dawnA) {
    const p = (T - FX.dawnA) / 3.6;
    FX.dawn = p < 0.35 ? easeOut(p / 0.35) : p < 1 ? 1 - easeIO((p - 0.35) / 0.65) : 0;
    if (p >= 1) { FX.dawnA = 0; FX.dawn = 0; }
  }
  if (T > nextMeteor) { if (!overlay && !REDUCED) randomMeteor(); nextMeteor = T + 14 + Math.random() * 26; }
  ambientTick();
}
function afterStitch(n) {
  if (n === 1) { meteorFrom(CONS[1].stars[6].v, true); whoosh(); }
  if (n === 29) { setTimeout(() => enterPlace('결의 첫 별을 기웠습니다. 이제 당신 차례입니다.'), 1100); return; }
  if (NV.on) { toast(`${josa(cname(n), '을', '를')} 하늘에 기웠습니다.`); if (NV.waitStitch === n) { NV.waitStitch = -1; vNextAfterStitch(n); } return; }
  const SPECIAL = {
    7: '이제 하늘을 두 손가락으로 가까이 당겨 보세요. 구멍마다 둘레에 바늘땀이 있습니다.',
    11: '베틀자리 가운데 별이 장단에 맞춰 깜박입니다.',
    24: '미리내를 가까이 당겨 보면, 건너 짠 올이 보입니다.',
    26: '달을 눌러 보세요. 반대쪽에서 뚫린 구멍입니다.',
    28: '붙박이별 둘레에 수선공마다 감은 실이 나이테처럼 남아 있습니다.'
  };
  let msg = SPECIAL[n] || `${josa(cname(n), '을', '를')} 하늘에 기웠습니다.`;
  if (!SPECIAL[n] && readCount() >= 2 && !S.tipMinor) { S.tipMinor = 1; save(); msg = '이름 없는 밝은 별들도 눌러 보세요. 잔별 기록이 백여덟 개 숨어 있습니다.'; }
  toast(msg);
  conCard(CONS[n].stars[0]);
}
function epilogueSequence() {
  flyCon(27, () => {
    meteorFrom(CONS[27].stars[3].v, true); whoosh();
    setTimeout(() => flyCon(29, () => stitch(29), 0), 2300);
  });
}
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  if (!document.hidden) {
    T += dt;
    update(dt);
    if (!overlay) {
      const t0 = performance.now();
      drawSky();
      tipFor();
      const cost = performance.now() - t0;
      slowFrames = cost > 24 ? slowFrames + 1 : Math.max(0, slowFrames - 1);
      if (slowFrames > 45 && DPRMAX > 1) { DPRMAX = Math.max(1, DPRMAX - 0.5); slowFrames = 0; resize(); }
    }
  }
  requestAnimationFrame(loop);
}
function start() {
  buildSky();
  resize();
  if (!Array.isArray(S.read)) S.read = [];
  if (!Array.isArray(S.found)) S.found = [];
  if (!Array.isArray(S.mine)) S.mine = [];
  S.found = S.found.filter(i => i >= 0 && i < MINOR.length);
  SKYN = S.last >= 0 && S.last <= 29 ? S.last : 0;
  document.documentElement.style.setProperty('--fs', S.fs || 1);
  if (S.sound) {
    const wake = () => { if (S.sound) setAmbient(true); document.removeEventListener('pointerdown', wake, true); };
    document.addEventListener('pointerdown', wake, true);
  }
  updateChrome();
  const m = /^#night-(\d+)$/.exec(location.hash);
  if (m) openReader(+m[1]);
  requestAnimationFrame(t => { lastT = t; loop(t); });
}
const boot = d => { if (STORE && typeof STORE === 'object') Object.assign(S, STORE); else if (d && typeof d === 'object') Object.assign(S, d); start(); };
try {
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
} catch (e) { boot({}); }

}
