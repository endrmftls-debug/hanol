<style>
/* VOICE   a proofreader of forty-eight tells, plainly, the spring she and her brother and sister made their mother's last jang
   IDEA    every chapter shows the jar stand (or the room, the shed, the yard) at that hour, the brine darkening day by day;
           the egg floats as salt goes into the water; the notebook's fifty dates are all horse days; the seed soy thins to four drops and is parted four ways
   PICTURE an old house outside Gongju: thirty-two onggi on a stone stand, meju hanging from the rack, a cauldron in the yard; soy brown and onggi umber
   TYPE    Gowun Batang for the story, Gowun Dodum for the log, Nanum Pen Script for the mother's notebook
   LAYOUT  phone: the scene above, the chapter as a sheet at the bottom; laptop: the chapters as a column on the left */

:root{color-scheme:light dark;--paper:light-dark(#f6f0e5,#1b1815);--paper2:light-dark(#ece3d3,#26211c);--ink:light-dark(#272320,#ece6dc);--ink2:light-dark(#6a625a,#b2a99d);--rule:light-dark(#dcd1bd,#3a332c);--sea:light-dark(#94461d,#e8b07a);--penink:light-dark(#2c3e6b,#a9bfe9);--seal:#c8452f;--ground:#1f1d18;--f-body:'Gowun Batang','Noto Serif KR',serif;--f-ui:'Gowun Dodum','Noto Sans KR',sans-serif;--f-pen:'Nanum Pen Script',cursive;--f-seal:'Song Myung','Gowun Batang',serif;--f-han:'Song Myung','Noto Serif KR','Noto Serif CJK KR',serif}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.6 var(--f-body);overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(40,32,26,.7);color:#f3ebdf;text-decoration:none;font:15px var(--f-ui);white-space:nowrap}
.tools{display:flex;gap:8px}
.ib{width:44px;height:44px;padding:0;border-radius:22px;border:0;background:rgba(40,32,26,.7);color:#f3ebdf;display:grid;place-items:center}
.ib svg,.chip svg,.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toast{position:absolute;z-index:40;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 58px);transform:translate(-50%,-10px);max-width:min(92vw,470px);padding:12px 18px;border-radius:14px;background:rgba(34,27,22,.94);color:#f5ecdf;font:15px/1.5 var(--f-ui);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* the board over the scene */
#hud{position:absolute;z-index:5;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 52px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:8px 8px 8px 12px;border-radius:14px;background:rgba(30,24,19,.78);color:#f1e7d9;font:13px/1.4 var(--f-ui);max-width:520px}
#hud .nm{font-size:14px;font-weight:700;color:#f6ecdd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .inf{color:#cdbfaa;font-size:12.5px}
#hud .pk{grid-column:1/-1;margin-top:3px;padding-top:5px;border-top:1px solid rgba(241,231,217,.14);color:#ffe2b8;min-height:1.4em}
#hud .hb{display:flex;gap:6px;grid-row:1/3;grid-column:2;align-items:center}
#hud .hb button{height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(241,231,217,.3);background:rgba(255,255,255,.06);color:#f1e7d9;font:13px var(--f-ui);white-space:nowrap}
#hud .hb #hudLid{background:#e7c58f;color:#2b2015;border-color:#e7c58f}
/* the chapter sheet */
.card{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;padding:4px 0 max(14px,env(safe-area-inset-bottom))}
.strip{display:flex;overflow-x:auto;gap:2px;padding:6px 10px 2px;scrollbar-width:none;scroll-behavior:smooth}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:50px;min-height:52px;border:0;border-radius:10px;background:none;color:var(--ink2);display:grid;justify-items:center;align-content:center;gap:5px;font:13px/1.1 var(--f-ui);padding:4px 0;font-variant-numeric:tabular-nums}
.strip .sw2{display:none}
.strip i{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;opacity:.45;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3.5px currentColor}
.strip .rd i{opacity:1}
.strip .on{color:var(--sea);background:var(--paper2)}
.strip .lk{opacity:.4}
.cb{padding:8px max(20px,env(safe-area-inset-left)) 0}
.cb .term{margin:0;font:14px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.cb h2{margin:2px 0 2px;font-size:clamp(30px,8.4vw,42px);line-height:1.08;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.cb .sub{margin:0;font-size:17px}
.cb .meta{margin:6px 0 0;font:14px var(--f-ui);color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.btn{height:48px;padding:0 22px;border-radius:24px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:700 17px var(--f-body);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn svg{width:20px;height:20px;stroke-width:1.8}
.note{font:14px var(--f-ui);color:var(--ink2);margin:10px 0 0}
.small{font:14px/1.6 var(--f-ui);color:var(--ink2)}
.link{border:0;background:none;padding:6px 0;color:var(--sea);font:15px var(--f-ui);text-decoration:underline;text-underline-offset:3px}
/* title */
#title{position:absolute;inset:0;z-index:20;display:grid;align-content:end;padding:0 max(22px,env(safe-area-inset-left)) max(34px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(24,19,15,0) 0%,rgba(24,19,15,.2) 36%,rgba(22,17,13,.94) 58%,rgba(22,17,13,.98) 100%);color:#f5ecdf;pointer-events:none}
#title .acts{pointer-events:auto}
#app.titled #card,#app.titled #hud{visibility:hidden}
#title .by{margin:0;font:15px var(--f-ui);opacity:.86}
#title h1{margin:6px 0 10px;font-size:clamp(40px,11vw,68px);line-height:1.05;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
#title .lead{margin:0;max-width:31em;font-size:17px;line-height:1.7;opacity:.93}
#title .acts .btn{background:#f5ecdf;color:#241c16;border-color:#f5ecdf}
#title .acts .btn.ghost{background:transparent;color:#f5ecdf}
#title .hint{margin:14px 0 0;font:14px var(--f-ui);opacity:.76}
/* reader */
#reader{position:absolute;inset:0;z-index:12;background:var(--paper);color:var(--ink);overflow-y:auto;overscroll-behavior:contain}
.rhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--paper);border-bottom:1px solid var(--rule)}
.rhead .ib{background:none;color:var(--ink)}
.rhead .rt{font:15px var(--f-ui);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rhead .grp{display:flex;gap:2px}
.rbody{max-width:660px;margin:0 auto;padding:26px max(20px,env(safe-area-inset-left)) 160px;font-size:calc(18px * var(--fs,1));line-height:1.86}
.rbody p{margin:0 0 1.05em}
.rbody p.han{font-family:var(--f-han);font-size:1.12em;letter-spacing:.08em;text-align:center;margin:1.2em 0;padding:.5em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.rbody .cal{margin:0 0 .35em;padding-left:1em;border-left:3px solid color-mix(in srgb,var(--seal) 55%,transparent);font-family:var(--f-ui);font-size:.92em;line-height:1.6}
.rbody p.nb{font:1.42em/1.45 var(--f-pen);color:var(--penink);margin:1.2em 0;padding:.35em .9em;background:var(--paper2);border-left:3px solid color-mix(in srgb,var(--penink) 45%,transparent);border-radius:3px}
.rbody p.sms{display:flex;margin:.5em 0}
.rbody p.sms span{max-width:80%;padding:.45em .95em;border-radius:1.1em 1.1em 1.1em .3em;background:var(--paper2);border:1px solid var(--rule);font:.94em/1.5 var(--f-ui)}
.rbody p.sms.me{justify-content:flex-end}
.rbody p.sms.me span{border-radius:1.1em 1.1em .3em 1.1em;background:light-dark(#f6df86,#5a4a1c);border-color:transparent}
.pen{font-family:var(--f-pen);font-size:1.3em;line-height:1.4;color:var(--penink)}
.chead{margin:4px 0 34px}
.chead .cl{margin:0;font:15px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.chead h1{margin:4px 0 6px;font-size:clamp(36px,9vw,52px);line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
.chead .cs{margin:0;font-size:1.05em}
.brk{display:block;text-align:center;margin:1.8em 0;color:var(--ink2);letter-spacing:.6em}
.speaking{background:color-mix(in srgb,#d9a35f 26%,transparent);border-radius:3px;box-shadow:0 0 0 4px color-mix(in srgb,#d9a35f 26%,transparent)}
/* a page of the ring notebook */
.rec{position:relative;margin:2.6em 0 1.6em;padding:16px 16px 18px;border:1px solid var(--rule);border-radius:6px;background:var(--paper2);font-family:var(--f-ui)}
.rec .rh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 10px;margin:0 0 10px;font-size:13px;color:var(--ink2);letter-spacing:.04em}
.rec .rh span:first-child{white-space:nowrap;font-weight:700}
.rec .rw{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:14px;align-items:start}
.rec canvas{width:100%;aspect-ratio:1;border-radius:6px;background:#26241f;display:block;cursor:pointer}
.rec dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px;font-size:.84em;line-height:1.55}
.rec dt{color:var(--ink2);padding:5px 0;border-bottom:1px solid var(--rule)}
.rec dd{margin:0;padding:5px 0;border-bottom:1px solid var(--rule)}
.rec dd.han{font-family:var(--f-han);letter-spacing:.04em}
.rec dd.han .tr{display:block;margin-top:4px;font-family:var(--f-ui);letter-spacing:0;color:var(--ink2);font-size:.94em}
.rec .quote{margin:14px 0 0;padding:10px 14px;border-left:3px solid var(--seal);background:light-dark(#fbf7f0,#201c18);font:1.02em/1.6 var(--f-body)}
.rec .who{display:block;font:12px var(--f-ui);color:var(--ink2);margin-bottom:3px;letter-spacing:.04em}
.rec .nbq{margin:12px 0 0;padding:8px 14px;background:light-dark(#fbf7ee,#1f1b17);border-left:3px solid color-mix(in srgb,var(--penink) 55%,transparent)}
.rec .nbq p{margin:0}
.rec .sign{margin:12px 0 0;text-align:right;font-size:.86em;color:var(--ink2)}
.rec .sign .pen{font-size:1.5em;margin-left:6px}
.rec .memo{margin:12px 0 0;font:1.32em/1.5 var(--f-pen);color:var(--sea);background-image:linear-gradient(transparent calc(1.5em - 1px),var(--rule) calc(1.5em - 1px));background-size:100% 1.5em}
.rec .memo p{margin:0}
.rec .ra{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rec .ra button{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--rule);background:var(--paper);font:14px var(--f-ui);display:inline-flex;align-items:center;gap:6px}
.rec .ra svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:420px){.rec .rw{grid-template-columns:1fr}.rec canvas{width:min(100%,260px);justify-self:center}}
.cend{margin-top:56px;padding-top:24px;border-top:1px solid var(--rule);display:grid;gap:14px;justify-items:start}
.cend .done{display:flex;align-items:center;gap:12px;color:var(--ink2);font:15px var(--f-ui)}
.stamp{display:inline-grid;place-items:center;width:58px;height:58px;border:2px solid var(--seal);color:var(--seal);font:700 17px/1 var(--f-seal);border-radius:50%;transform:rotate(-8deg);opacity:.9}
.stampfx{animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(1.6) rotate(-16deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:.9}}
/* narration */
#player{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:28px;background:var(--ink);color:var(--paper);max-width:calc(100vw - 24px)}
#player .ib{background:none;color:var(--paper)}
#player .rate{width:auto;padding:0 12px;font:15px var(--f-ui)}
#player .pt{font:14px var(--f-ui);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
/* the box */
#box{position:absolute;inset:0;z-index:11;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;justify-content:space-between;padding:max(6px,env(safe-area-inset-top)) 8px 0 max(18px,env(safe-area-inset-left))}
.bhead h2{margin:0;font-size:22px}
.bhead .ib{background:none;color:var(--ink)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:48px;padding:0 13px;border:0;border-bottom:2px solid transparent;background:none;font:16px var(--f-ui);color:var(--ink2)}
.tabs button[aria-selected=true]{color:var(--sea);border-bottom-color:var(--sea)}
.pane{flex:1;overflow-y:auto;padding:14px max(18px,env(safe-area-inset-left)) 120px}
.toc{list-style:none;margin:0;padding:0}
.toc li+li{border-top:1px solid var(--rule)}
.toc button{width:100%;min-height:62px;border:0;background:none;display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:8px 2px}
.toc .t1{font:14px var(--f-ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.toc .t2{font-size:18px;font-weight:700;line-height:1.25}
.toc .t3{display:block;font:14px var(--f-ui);font-weight:400;color:var(--ink2)}
.toc .sm{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--seal);color:var(--seal);border-radius:50%;font:700 12px/1 var(--f-seal);transform:rotate(-8deg)}
.toc .lk{opacity:.45}
.toc .cur .t2{color:var(--sea)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.6em,1fr));gap:12px;margin-top:12px}
.album button{border:0;padding:0;background:none;text-align:left;display:grid;gap:4px;font:13px/1.4 var(--f-ui);color:var(--ink2)}
.album canvas{width:100%;aspect-ratio:1;border-radius:8px;background:#26241f;display:block}
.album .ph{width:100%;aspect-ratio:1;border-radius:8px;background:var(--paper2);display:grid;place-items:center;font:14px var(--f-ui);color:var(--ink2);text-align:center;padding:8px}
.album b{color:var(--ink);font-size:15px}
.album button:disabled{cursor:default;opacity:.55}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:6px 14px;font:14px var(--f-ui);color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend b{color:var(--ink);font-weight:400}
.gfil{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.gfil button{height:38px;padding:0 13px;border-radius:19px;border:1.5px solid var(--rule);background:none;font:14px var(--f-ui)}
.gfil button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.gsearch{width:100%;font:16px var(--f-ui);padding:11px 12px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper)}
.gl{list-style:none;margin:8px 0 0;padding:0}
.gl li{padding:11px 0;border-top:1px solid var(--rule)}
.gl b{font-size:17px}
.gl .k{font:13px var(--f-ui);color:var(--ink2);margin-left:6px}
.gl p{margin:3px 0 0;font:15px/1.65 var(--f-ui)}
.gl .go{font-size:14px}
.set{display:grid;gap:18px;font-family:var(--f-ui)}
.set h3{margin:6px 0 0;font-size:16px}
.set .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.set select{font-size:16px;padding:10px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);max-width:100%}
.set input[type=range]{width:min(100%,260px);accent-color:var(--sea)}
.sw{position:relative;width:58px;height:34px;border-radius:17px;border:1.5px solid var(--rule);background:var(--paper2);padding:0;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--ink2);transition:left .2s}
.sw[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
.sw[aria-pressed=true]::after{left:26px;background:var(--paper)}
/* the overlay: the egg, the calendar, the seed soy */
#ov{position:absolute;z-index:14;left:0;right:0;top:0;bottom:0;background:#1d1b17;color:#f1e9da;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#ov>*{flex:none}
#ov h2{margin:0;font:700 19px/1.3 var(--f-body)}
