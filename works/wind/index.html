<style>
/* VOICE   quiet and tender: a year of grief and wind on a small island, told by a girl of seventeen

:root{color-scheme:light dark;--paper:light-dark(#f3efe5,#1a2127);--paper2:light-dark(#e9e2d1,#222b32);--ink:light-dark(#1c2630,#ebe6db);--ink2:light-dark(#56616b,#a6afb5);--rule:light-dark(#d5cbb6,#38444c);--seal:#c23b22;--seal2:light-dark(#c23b22,#e0634a);--night:#132430;--f-body:'Gowun Batang','Noto Serif KR',serif;--f-pen:'Gowun Dodum','Noto Sans KR',sans-serif;--f-suni:'Nanum Brush Script','Gowun Batang',serif;--f-geum:'Nanum Pen Script','Gowun Dodum',sans-serif;--f-yun:'Dokdo','Gowun Dodum',sans-serif;--f-sol:'Gaegu','Gowun Dodum',sans-serif;--f-yeon:'Hi Melody','Gaegu',sans-serif;--f-seal:'Song Myung','Gowun Batang',serif}

*{box-sizing:border-box;min-width:0}

.brk{display:block;text-align:center;margin:1.8em 0;color:var(--ink2);letter-spacing:.6em}
.w{font-family:var(--f-pen)}
.hn{margin:1.4em 0;padding:16px 18px;border-left:3px solid var(--rule);background:var(--paper2);border-radius:2px 6px 6px 2px}
.hn p{margin:0 0 .75em}
.hn p:last-child{margin:0}
.hn.h-yun{font-family:var(--f-yun);font-size:1.2em;line-height:1.6}
.hn.h-yeon{font-family:var(--f-yeon);font-size:1.24em;line-height:1.65;border-left-color:#d9a1a0}
.page{position:relative;margin:2.2em 0;padding:18px 18px 20px;background:var(--paper2);border:1px solid var(--rule);border-radius:3px}

.page dd{margin:0}
.page .pb p{margin:0 0 .7em}
.page .pb p:last-child{margin:0}
.h-suni dd,.h-suni .pb{font-family:var(--f-suni);font-size:1.3em;line-height:1.5}
.h-geum dd,.h-geum .pb{font-family:var(--f-geum);font-size:1.34em;line-height:1.45}
.h-yun dd,.h-yun .pb{font-family:var(--f-yun);font-size:1.2em;line-height:1.55}

.mine{display:grid;gap:14px;width:100%;margin-top:10px;font-size:16px}

    <div class="tools">
      <button class="ib" id="bSound" aria-label="소리 끄기"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sw1" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="ib" id="bBook" aria-label="바람책 펼치기"><svg viewBox="0 0 24 24"><path d="M4 5.5c2.5-1 5-1 8 1 3-2 5.5-2 8-1v13c-2.5-1-5-1-8 1-3-2-5.5-2-8-1z"/><path d="M12 6.5v13"/></svg></button>
    </div>
  </header>

  }
  if (sec.body.length) {
    html += '<div class="pb">' + sec.body.map(p => {

}

/* ---------- the wind rose ---------- */
function roseSVG(big) {
  const R = 100, pol = (a, r) => [Math.sin(a) * r, -Math.cos(a) * r];
  const col = big ? 'currentColor' : '#ffffff';
  let s = `<svg viewBox="-128 -128 256 256" ${big ? 'role="img" aria-label="지금까지 읽은 바람의 바람장미"' : 'aria-hidden="true"'}>`;
  [3, 6, 9, 12].forEach(f => { s += `<circle r="${(R * (0.2 + 0.8 * f / 12)).toFixed(1)}" fill="none" stroke="${col}" stroke-opacity="${big ? 0.22 : 0.35}" ${f === 12 ? '' : 'stroke-dasharray="2 5"'}/>`; });
  DIRS.forEach(d => {
    const a = d[0] * Math.PI / 180, [x, y] = pol(a, R), [x2, y2] = pol(a, R * 0.16);
    s += `<line x1="${x2.toFixed(1)}" y1="${y2.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-opacity="${big ? 0.16 : 0.25}"/>`;
    if (big) { const [lx, ly] = pol(a, R * 1.15); s += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="currentColor" opacity=".75" font-family="Gowun Batang,serif">${d[1]}</text>`; }
  });
  const petal = (from, force, color, key, kind) => {
    const L = R * (0.2 + 0.8 * force / 12);
    if (kind === 'radial' || kind === 'chaos' || kind === 'cyclone') {
      return `<circle data-k="${key}" r="${(L * 0.42).toFixed(1)}" fill="none" stroke="${color}" stroke-width="${kind === 'cyclone' ? 7 : 4}" stroke-opacity=".85" ${kind === 'chaos' ? 'stroke-dasharray="3 4"' : ''}/>`;
    }
    const a = from * Math.PI / 180, p0 = pol(a, 9), p1 = pol(a - 0.13, L * 0.56), p2 = pol(a, L), p3 = pol(a + 0.13, L * 0.56);
    return `<path data-k="${key}" d="M${p0.map(v => v.toFixed(1)).join(' ')}L${p1.map(v => v.toFixed(1)).join(' ')}L${p2.map(v => v.toFixed(1)).join(' ')}L${p3.map(v => v.toFixed(1)).join(' ')}Z" fill="${color}" fill-opacity=".82" stroke="${big ? 'var(--paper)' : 'rgba(10,20,28,.5)'}" stroke-width="1"/>`;
  };
  const ps = [];
  CH.forEach((c, n) => { if (n > 0 && n < LAST && isRead(n)) ps.push([c.force, petal(c.from, c.force, PETAL[SEASON[n]], n, c.kind)]); });
  ps.sort((a, b) => b[0] - a[0]).forEach(p => { s += p[1]; });
  if (S.mine && isRead(LAST)) s += petal(S.mine.from, 3, PETAL.mine, 'mine', 'flow');
  s += `<circle r="5" fill="${col}" fill-opacity=".8"/>`;
  return s + '</svg>';
}

  M.paused = true;
  closeBook();
  M.paused = true;

  setTimeout(() => $('#rClose').focus({ preventScroll: true }), 50);
}
function closeReader() {
  vStop();

function markRead(n, quiet) {

function bindMine() {
  const f = $('#mineForm');

  $('#mD').addEventListener('click', e => {
    const b = e.target.closest('button[data-d]');

function mineText() {

}

function act(a, el) {
  const n = S.cur;
  if (a === 'read') openReader(n);
  else if (a === 'listen') openReader(n, true);
  else if (a === 'next') select(n + 1);
  else if (a === 'first') select(0);
  else if (a === 'stamp') stampHere(n);
  else if (a === 'nextCh') { closeReaderQuiet(); openReader(n + 1); }
  else if (a === 'toMap') closeReader();
  else if (a === 'skipMine') { stampHere(LAST); }
  else if (a === 'copyMine') {
    const t = mineText();
    try { navigator.clipboard.writeText(t).then(() => toast('복사했습니다. 어디에든 붙여 넣으세요.'), () => toast('이 화면에서는 복사가 막혀 있습니다. 글을 길게 눌러 복사해 주세요.')); }
    catch (e) { toast('이 화면에서는 복사가 막혀 있습니다. 글을 길게 눌러 복사해 주세요.'); }
  }
}

/* ---------- reading aloud with the device's own Korean voices ---------- */
const NV = { kind: null, why: '', voices: [], bad: new Set(), on: false, paused: false, n: -1, segs: [], idx: 0, tok: 0, err: 0, timer: 0, dog: 0, cur: null, lock: null, userScroll: 0, hi: null };
const VR = { A: null, B: null, C: null };
const MALE_RE = /(male|남성|injoon|hyunsu|bongjin|gookmin|minsu|jian|-x-koc|-x-kod|smtm)/i;
const FEMALE_RE = /(female|여성|sunhi|heami|jimin|seohyeon|soonbok|yujin|yuna|sora|suhyun|google 한국|-x-ism|-x-kob|smtf)/i;
const isMale = v => !!v && MALE_RE.test(v.name) && !/female/i.test(v.name);
